
<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,viewport-fit=cover">

<style>

:root {
  color-scheme:dark;
  --bg:#11131c;
  --card:#1c202d;
  --line:#303647;
  --text:#f3f4fa;
  --muted:#969eb3;
  --green:#65d6a5;
  --red:#f08090;
  --blue:#8faaff;
  --gold:#f2c879;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  padding:
    calc(18px + env(safe-area-inset-top))
    14px
    calc(110px + env(safe-area-inset-bottom));
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,
    BlinkMacSystemFont,sans-serif;
  font-size:14px;
}

h1,h2,h3,p {
  margin:0;
}

h1 {
  font-size:24px;
}

h2 {
  font-size:17px;
  margin-bottom:10px;
}

h3 {
  font-size:15px;
}

p {
  line-height:1.6;
}

header {
  margin-bottom:18px;
}

.subtitle {
  font-size:10px;
  letter-spacing:2px;
  color:var(--muted);
  margin-top:5px;
}

.badge {
  background:#30384f;
  color:var(--blue);
  border-radius:10px;
  padding:9px;
  font-size:12px;
  white-space:nowrap;
}

.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  margin-bottom:12px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 4px;
  text-align:center;
}

.stat strong {
  display:block;
  font-size:28px;
  margin-bottom:5px;
}

small,.muted {
  color:var(--muted);
}

small,.small {
  font-size:12px;
}

.green {
  color:var(--green);
}

.red {
  color:var(--red);
}

.blue {
  color:var(--blue);
}

.gold {
  color:var(--gold);
}

.row {
  display:flex;
  align-items:center;
  gap:8px;
}

.between {
  justify-content:space-between;
}

.grow {
  flex:1;
  min-width:0;
}

.toolbar {
  margin-bottom:12px;
}

button,input,textarea,select {
  font:inherit;
  color:var(--text);
}

button {
  border:0;
  background:#30374b;
  border-radius:10px;
  padding:12px;
  font-weight:600;
  touch-action:manipulation;
  cursor:pointer;
}

button:active {
  opacity:.65;
}

.primary {
  background:#5269b8;
  color:white;
}

.success {
  background:#21483e;
  color:var(--green);
}

.danger {
  background:#492a37;
  color:var(--red);
}

.mini {
  font-size:12px;
  padding:9px 10px;
  white-space:nowrap;
}

.full {
  width:100%;
  margin-top:9px;
}

input,select,textarea {
  background:#141722;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  width:100%;
  margin:6px 0 12px;
  font-size:16px;
}

textarea {
  min-height:80px;
}

label {
  color:var(--muted);
  font-size:13px;
}

.check {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
}

.check input {
  width:22px;
  height:22px;
  margin:0;
}

.count {
  width:75px;
  margin:0;
}

.item {
  border-bottom:1px solid var(--line);
  padding:12px 0;
}

.item:last-child {
  border-bottom:0;
}

.avatar {
  width:39px;
  height:39px;
  border-radius:11px;
  background:#30374b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  flex-shrink:0;
}

.dead .avatar,
.dead .playerName {
  opacity:.45;
}

.dead .playerName {
  text-decoration:line-through;
}

.speech {
  background:#141722;
  border-left:3px solid var(--blue);
  border-radius:8px;
  padding:14px;
  margin:12px 0;
  line-height:1.7;
}

.progress {
  height:6px;
  border-radius:8px;
  background:#303647;
  overflow:hidden;
  margin:10px 0;
}

.progress div {
  height:100%;
  background:var(--green);
}

.timer {
  font-size:48px;
  text-align:center;
  font-weight:750;
  font-variant-numeric:tabular-nums;
  padding:16px;
}

.voteNumber {
  min-width:28px;
  text-align:center;
  font-size:20px;
}

nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:#191d29;
  border-top:1px solid var(--line);
  padding:8px 5px
    calc(10px + env(safe-area-inset-bottom));
  z-index:10;
}

nav button {
  flex:1;
  padding:5px 0;
  background:transparent;
  color:var(--muted);
  font-size:10px;
}

nav button.active {
  color:var(--blue);
}

nav span {
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal {
  width:100%;
  max-width:480px;
  max-height:75vh;
  overflow:auto;
  background:#222736;
  border:1px solid #41495d;
  border-radius:20px;
  padding:20px;
  box-shadow:0 15px 50px #0008;
}

.modalButtons {
  margin-top:15px;
}

.modalButtons button {
  min-height:44px;
}

.notice {
  color:var(--gold);
  font-size:12px;
  line-height:1.6;
  margin:10px 0;
}

.notice.red {
  color:var(--red);
}

.empty {
  color:var(--muted);
  text-align:center;
  padding:25px 5px;
}


.clearArea {
  border-top:1px solid var(--line);
  margin-top:16px;
  padding-top:14px;
}

.clearButton {
  width:100%;
  background:transparent;
  border:1px solid #70404b;
  color:#f08090;
  border-radius:10px;
  padding:12px;
  font-size:13px;
  font-weight:500;
}

.clearButton:active {
  background:#492a37;
}


.clearRoleButton {
  width:100%;
  background:transparent;
  border:1px solid #5269b8;
  color:#8faaff;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  font-size:13px;
  font-weight:500;
}

.clearRoleButton:active {
  background:#30384f;
}

</style>

<body>

<div id="app"></div>
<div id="modal"></div>

<script>
    const roles =
      [{"id":"wolf","name":"หมาป่า","icon":"🐺","team":"wolf","order":20,"action":"kill","speech":"หมาป่าลืมตา เลือกเหยื่อหนึ่งคน"},{"id":"guard","name":"ผู้พิทักษ์","icon":"🛡️","team":"village","order":10,"action":"protect","speech":"ผู้พิทักษ์ลืมตา เลือกคนที่ต้องการปกป้อง"},{"id":"seer","name":"ผู้หยั่งรู้","icon":"🔮","team":"village","order":30,"action":"inspect","speech":"ผู้หยั่งรู้ลืมตา เลือกคนที่ต้องการตรวจสอบ"},{"id":"witch","name":"แม่มด","icon":"🧪","team":"village","order":40,"action":"witch","speech":"แม่มดลืมตา เลือกใช้ยารักษาหรือยาพิษ"},{"id":"hunter","name":"นายพราน","icon":"🏹","team":"village","order":0,"action":"none","speech":"นายพรานเลือกผู้เล่นที่จะยิง"},{"id":"villager","name":"ชาวบ้าน","icon":"👨‍🌾","team":"village","order":0,"action":"none","speech":""},{"id":"cupid","name":"กามเทพ","icon":"💘","team":"village","order":1,"action":"custom","firstOnly":true,"speech":"กามเทพลืมตา เลือกคู่รักสองคน"},{"id":"littleGirl","name":"เด็กหญิง","icon":"👧","team":"village","order":0,"action":"none","speech":""},{"id":"jester","name":"ตัวตลก","icon":"🤡","team":"neutral","order":0,"action":"none","speech":""},{"id":"minion","name":"สมุนรับใช้","icon":"🕴️","team":"wolf","order":2,"firstOnly":true,"action":"revealWolves","speech":"สมุนรับใช้ลืมตา ผู้ดำเนินเกมชี้ให้เห็นมนุษย์หมาป่า","description":"รู้ว่าใครเป็นหมาป่า แต่ไม่ตื่นร่วมกับหมาป่า","balance":-6},{"id":"wolfCub","name":"ลูกมนุษย์หมาป่า","icon":"🐺","team":"wolf","order":0,"action":"none","speech":"","description":"เมื่อตาย หมาป่ากำจัดผู้เล่นได้สองคนในคืนถัดไป","balance":-8},{"id":"spellcaster","name":"จอมเวท","icon":"🤫","team":"village","order":50,"action":"silence","speech":"จอมเวทลืมตา เลือกผู้เล่นที่ห้ามพูดในวันถัดไป","description":"เลือกผู้เล่นหนึ่งคนให้ห้ามพูดในวันถัดไป","balance":1},{"id":"cursed","name":"ผู้ต้องคำสาป","icon":"🌘","team":"village","order":0,"action":"none","speech":"","description":"เมื่อถูกหมาป่ากำจัด จะกลายเป็นหมาป่าแทน","balance":-3},{"id":"revealer","name":"ผู้เผยตัวตน","icon":"⚔️","team":"village","order":60,"action":"reveal","speech":"ผู้เผยตัวตนลืมตา เลือกผู้เล่นหนึ่งคน","description":"ถ้าเลือกหมาป่า เป้าหมายจะตาย หากไม่ใช่จะตายเอง","balance":4},{"id":"doppelganger","name":"ภูตจำแลง","icon":"🎭","team":"village","order":3,"firstOnly":true,"action":"copy","speech":"ภูตจำแลงลืมตา เลือกผู้เล่นที่จะสวมรอย","description":"เมื่อผู้เล่นที่เลือกตาย จะได้รับบทบาทนั้น","balance":-2},{"id":"toughGuy","name":"หนุ่มถึก","icon":"💪","team":"village","order":0,"action":"none","speech":"","description":"เมื่อถูกหมาป่ากำจัด จะรอดชีวิตจนถึงคืนถัดไป"},{"id":"diseased","name":"ผู้ป่วยติดเชื้อ","icon":"🦠","team":"village","order":0,"action":"none","speech":"","description":"เมื่อถูกหมาป่ากำจัด หมาป่าจะโจมตีไม่ได้ในคืนถัดไป"},{"id":"prince","name":"เจ้าชาย","icon":"🤴","team":"village","order":0,"action":"none","speech":"","description":"รอดจากการโหวตครั้งแรก โดยเปิดเผยบทบาท"}];

    function fresh() {
  return {
    version:1.3,
    players:[],
    roles:JSON.parse(JSON.stringify(roles)),
    phase:"setup",
    night:0,
    step:0,
    queue:[],
    actions:{},
    potions:{heal:true,poison:true},
    votes:{},
    history:[],
    deaths:[],
    undo:[],
    timerEnd:0,
    voted:false,
    result:""
  };
}

    function dashboard(initial) {

  let S = initial;
  if (!S.previousNightTargets && S.night > 1) {
    const prev = (S.undo || []).slice().reverse().find(x=>x.night===S.night-1 && x.phase==='day');
    if (prev) S.previousNightTargets = {night:prev.night, guard:prev.actions?.guard?.skip?'':prev.actions?.guard?.target||'', seer:prev.actions?.seer?.skip?'':prev.actions?.seer?.target||''};
  }
  const defaults21 = {autoSpeech:false, sound:true, warning:true, awake:false, discussion:true, rate:1};
  let prefs = {...defaults21};
  try { Object.assign(prefs, JSON.parse(localStorage.getItem("WerewolfSettings21") || "{}")); } catch(e) {}
  let lastCue = "", wakeLock = null, audio = null, warnedEnd = 0;


    S.roles.forEach(r => {
      if (
        r.id === "revealer" ||
        r.name.includes("ผู้เผยตัวตน")
      ) {
        r.order = 0;
        r.firstOnly = false;
        r.action = "none";
        r.speech =
          "ใช้พลังกลางวันได้ครั้งเดียวตลอดเกม";
      }
    });
  let tab = "home";
  let votingOpen = S.phase==="day" && !S.voted && Object.values(S.votes||{}).some(v=>v>0);
  let modalAction = null;
  let pending = null;
  let wake = null;
  let status = "บันทึกแล้ว";

  const $ = id => document.getElementById(id);

  const uid = () =>
    Date.now().toString(36) +
    Math.random().toString(36).slice(2,9);

  const esc = v => String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

  const role = id =>
    S.roles.find(r=>r.id===id) ||
    {
      id:"",
      name:"ยังไม่กำหนด",
      icon:"❔",
      team:"none",
      action:"none"
    };

  const player = id =>
    S.players.find(p=>p.id===id);

  const alive = () =>
    S.players.filter(p=>p.alive);

  const nameOf = id =>
    player(id)?.name || "ไม่มี";

  const teamName = t => ({
    wolf:"หมาป่า",
    village:"ชาวบ้าน",
    neutral:"อิสระ"
  }[t] || "ไม่กำหนด");

  function snapshot() {
    const copy = JSON.parse(JSON.stringify(S));
    delete copy.undo;

    S.undo = S.undo || [];
    S.undo.push(copy);

    if(S.undo.length>40) S.undo.shift();
  }

  function log(text) {
    S.history.unshift({
      id:uid(),
      night:S.night,
      phase:S.phase,
      time:new Date().toLocaleTimeString("th-TH"),
      text:text
    });
  }

  // =========================
  // AUTO SAVE
  // =========================

  
    function commit() {
      try {
        localStorage.setItem(
          "WerewolfMasterV2",
          JSON.stringify(S)
        );
        status = "บันทึกแล้ว";
      } catch(e) {
        status = "บันทึกไม่สำเร็จ";
      }

      render();
      syncCue();
      window.saveStatus(
        status === "บันทึกแล้ว"
      );
    }

    window.waitForSave = function(cb) {
    if(pending !== null) {
      const data = pending;
      pending = null;
      cb(data);
    } else {
      wake = cb;
    }
  };

  window.getGame = () => JSON.stringify(S);

  window.saveStatus = function(ok) {
    status = ok ? "บันทึกแล้ว" : "บันทึกไม่สำเร็จ";

    const el = $("saveStatus");

    if(el) {
      el.textContent = "● "+status;
      el.style.color = ok
        ? "#65d6a5"
        : "#f08090";
    }
  };

  // =========================
  // UI HELPERS
  // =========================

  function btn(text,action,cls="") {
    return `<button class="${cls}"
      onclick="${esc(action)}">
      ${esc(text)}
    </button>`;
  }

  function call(fn,...args) {
    return fn+"("+
      args.map(a=>JSON.stringify(a)).join(",")+
      ")";
  }

  function card(content) {
    return `<section class="card">
      ${content}
    </section>`;
  }

  // =========================
  // CUSTOM DIALOG
  // ไม่ใช้ alert / confirm
  // =========================

  function showModal(
    title,body,action=null,
    buttonText="บันทึก"
  ) {
    modalAction = action;

    $("modal").innerHTML = `
      <div class="overlay">
        <div class="modal">
          <div class="row between">
            <h2>${esc(title)}</h2>
            ${btn("✕","closeModal()","mini")}
          </div>

          ${body}

          ${action?`
            <div class="row modalButtons">
              ${btn("ยกเลิก",
                "closeModal()","grow")}
              ${btn(buttonText,
                "submitModal()","primary grow")}
            </div>
          `:""}
        </div>
      </div>`;
  }

  function closeModal() {
    $("modal").innerHTML = "";
    modalAction = null;
  }

  function submitModal() {
    const action = modalAction;
    if(action) action();
  }

  function notice(message,title="แจ้งเตือน") {
    showModal(
      title,
      `<div class="speech">
        ${esc(message)}
      </div>
      ${btn("ตกลง",
        "closeModal()","primary full")}`
    );
  }

  // แจ้งข้อผิดพลาดโดยไม่ปิดฟอร์ม
  function formError(message) {
    let el = $("formError");

    if(!el) {
      el = document.createElement("div");
      el.id = "formError";
      el.className = "notice red";

      const box = document.querySelector(".modal");

      if(box) {
        box.appendChild(el);
      } else {
        notice(message);
        return;
      }
    }

    el.textContent = message;
    el.scrollIntoView({block:"nearest"});
  }

  function ask(message,action) {
    showModal(
      "ยืนยันการทำงาน",
      `<div class="speech">
        ${esc(message)}
      </div>`,
      ()=>{
        closeModal();
        action();
      },
      "ยืนยัน"
    );
  }

  // =========================
  // UNDO
  // =========================

  function undo() {
    if(!S.undo?.length) {
      return notice("ไม่มีรายการให้ย้อนกลับ");
    }

    ask("ย้อนกลับรายการล่าสุด?",()=>{
      const stack = S.undo;
      S = stack.pop();
      S.undo = stack;
      tab = "home";
      commit();
    });
  }

  function roleOptions(selected="") {
    return `<option value="">
      ยังไม่กำหนด
    </option>`+
    S.roles.map(r=>`
      <option value="${esc(r.id)}"
        ${r.id===selected?"selected":""}>
        ${esc(r.icon+" "+r.name)}
      </option>
    `).join("");
  }

  function targets(
    selected="",
    filter=()=>true
  ) {
    return `<option value="">
      ไม่เลือก / ข้าม
    </option>`+
    alive().filter(filter).map(p=>`
      <option value="${esc(p.id)}"
        ${p.id===selected?"selected":""}>
        ${esc(p.name)}
      </option>
    `).join("");
  }

  // =========================
  // PLAYERS
  // =========================

  function editPlayer(id="") {
    const p = player(id);

    if(!p && S.phase!=="setup") {
      return notice("เพิ่มผู้เล่นก่อนเริ่มเกม");
    }

    showModal(
      p?"แก้ไขผู้เล่น":"เพิ่มผู้เล่น",
      `
      <label>ชื่อผู้เล่น</label>
      <input id="pname"
        value="${esc(p?.name||"")}"
        placeholder="ชื่อเพื่อน">

      <label>บทบาท</label>
      <select id="prole">
        ${roleOptions(p?.roleId||"")}
      </select>
      `,
      ()=>{
        const name = $("pname").value.trim();
        const rid = $("prole").value;

        if(!name) {
          return formError("กรุณากรอกชื่อ");
        }

        if(S.players.some(x=>
          x.name===name && x.id!==id
        )) {
          return formError("ชื่อนี้มีอยู่แล้ว");
        }

        if(S.phase!=="setup" && !rid) {
          return formError("กรุณากำหนดบทบาท");
        }

        snapshot();

        if(p) {
          p.name = name;
          p.roleId = rid;
        } else {
          S.players.push({
            id:uid(),
            name:name,
            roleId:rid,
            alive:true
          });
        }

        closeModal();
        commit();
      }
    );
  }

  function quickAdd() {
    if(S.phase!=="setup") {
      return notice("กรุณาเริ่มเกมใหม่ก่อน");
    }

    showModal(
      "เพิ่มผู้เล่นหลายคน",
      `
      <label>หนึ่งชื่อต่อหนึ่งบรรทัด</label>
      <textarea id="names"
        placeholder="ส้ม&#10;บอย&#10;เอ">
      </textarea>
      `,
      ()=>{
        const names = $("names").value
          .split(/\n|,/)
          .map(x=>x.trim())
          .filter(Boolean);

        if(!names.length) {
          return formError("กรุณากรอกชื่อ");
        }

        snapshot();

  function killPlayer(p,reason) {

    if(
      p &&
      p.alive &&
      p.roleId==="prince" &&
      reason==="ถูกโหวต" &&
      !p.princeRevealed
    ) {

      p.princeRevealed = true;

      specialAlert(
        "🤴 เจ้าชายเปิดเผยตัวตน",
        p.name+
        " ถูกโหวต แต่รอดชีวิต "+
        "กรุณาให้ผู้เล่นเปิดเผยการ์ดเจ้าชาย"
      );

      return "";
    }


    const wasAlive =
      Boolean(p && p.alive);

    const result =
      killPlayerBeforeCupid(p,reason);

    let extra = "";

    if (
      wasAlive &&
      p &&
      !p.alive
    ) {

      extra = loverDeath(p);

    }

    return [result,extra]
      .filter(Boolean)
      .join(" / ");
  }

  function killPlayerBeforeCupid(p,reason) {

    const wasAlive = Boolean(
      p && p.alive
    );

    const result = originalKillPlayer(
      p,reason
    );

    if (
      wasAlive &&
      p &&
      !p.alive &&
      isHunter(p)
    ) {

      if (
        !hunterQueue().includes(p.id)
      ) {

        hunterQueue().push(p.id);

        log(
          "🏹 "+p.name+
          " รอเลือกเป้าหมาย"
        );
      }

      scheduleHunter();

      return "";
    }

    return result;
  }

  function originalKillPlayer(p,reason) {
    if(!p || !p.alive) return "";

    
    p.alive = false;

    if(p.roleId==="wolfCub") {
      S.cubPending = true;
      log("คืนถัดไปหมาป่ากำจัดได้ 2 คน");
    }

    transformDoppelganger(p);
    
    delete S.votes[p.id];

    log(p.name+" เสียชีวิต: "+reason);

    if(p.roleId==="hunter") {
      log("นายพรานรอใช้ความสามารถ");
      return "🏹 "+p.name+
        " เป็นนายพราน กรุณาจัดการการยิง";
    }

    if(p.roleId==="jester" &&
       reason==="ถูกโหวต") {
      return "🤡 ตัวตลกถูกโหวต กรุณาตรวจสอบเงื่อนไขชนะ";
    }

    return "";
  }

  function shuffleRoles() {
    if(S.phase!=="setup") {
      return notice("สุ่มได้ก่อนเริ่มเกม");
    }

    const n = S.players.length;

    if(!n) return notice("เพิ่มผู้เล่นก่อน");

    const counts = {};

    
      S.players.forEach(p=>{
        p.originalRoleId = p.roleId;
    
      counts[p.roleId] =
        (counts[p.roleId]||0)+1;
    });

    showModal(
      "สุ่มบทบาท",
      `
      <p class="muted">
        ผู้เล่นทั้งหมด ${n} คน
      </p>

      ${S.roles.map(r=>`
        <div class="item row between">
          <span>${esc(r.icon+" "+r.name)}</span>
          <input type="number"
            class="count"
            min="0" max="${n}"
            id="count_${esc(r.id)}"
            value="${counts[r.id]||0}">
        </div>
      `).join("")}

      <p class="notice">
        จำนวนที่เหลือจะเติมชาวบ้านให้อัตโนมัติ
      </p>
      `,
      ()=>{
        const deck = [];

        for(const r of S.roles) {
          const count = Number(
            $("count_"+r.id).value
          );

          if(!Number.isInteger(count) ||
             count<0 || count>n) {
            return formError(
              "จำนวนบทบาทไม่ถูกต้อง"
            );
          }

          for(let i=0;i<count;i++) {
            deck.push(r.id);
          }
        }

        if(deck.length>n) {
          return formError(
            "ตัวละครมากกว่าผู้เล่น"
          );
        }

        while(deck.length<n) {
          deck.push("villager");
        }

        for(let i=deck.length-1;i>0;i--) {
          const j = Math.floor(
            Math.random()*(i+1)
          );

          [deck[i],deck[j]] =
            [deck[j],deck[i]];
        }

        snapshot();

        S.players.forEach((p,i)=>{
          p.roleId = deck[i];
          p.alive = true;
        });

        log("สุ่มบทบาทเรียบร้อย");
        closeModal();
        commit();
      },
      "สุ่มบทบาท"
    );
  }

  function startGame() {

      if(S.registration) {
        return notice(
          "กรุณาลงทะเบียนบทบาทให้เสร็จ "+
          "หรือยกเลิกก่อนเริ่มเกม"
        );
      }

    if(S.phase!=="setup") {
      return notice("เกมเริ่มแล้ว");
    }

    if(S.players.length<3) {
      return notice(
        "ต้องมีผู้เล่นอย่างน้อย 3 คน"
      );
    }

    if(S.players.some(p=>!role(p.roleId).id)) {
      return notice(
        "กำหนดบทบาทให้ครบทุกคนก่อน"
      );
    }

    if(!S.players.some(p=>isWolf(p))) {
      return notice(
        "ต้องมีหมาป่าอย่างน้อย 1 คน"
      );
    }

    if(!S.players.some(p=>
      role(p.roleId).team==="village"
    )) {
      return notice("ต้องมีฝ่ายชาวบ้าน");
    }

    ask(prefs.discussion ? "เริ่มช่วงอภิปรายก่อนคืนแรก?" : "เริ่มเกมคืนที่ 1?",()=>{
      snapshot();

      
      S.players.forEach(p=>{
        p.alive = true;
        p.originalRoleId = p.roleId;

        delete p.copyTarget;
        delete p.silenced;
        delete p.toughDueNight;
        delete p.princeRevealed;
        delete p.transformedFrom;
        delete p.transformedNight;
        delete p.cursedConverted;
        delete p.cursedNight;
      });

      S.cubPending = false;
      S.doubleAttack = false;
      S.silenced = "";
    
      S.night = 0;
      S.specialNotices = [];
      S.wolfBlockedNight = 0;
      S.lovers = [];
      S.loveNotices = [];
      S.cursedNotices = [];
      S.copyNotices = [];
      S.hunterPending = [];
      S.revealerUsed = false;
      S.history = [];
      S.result = "";
      S.potions = {
        heal:true,
        poison:true
      };

      S.timerEnd = 0; S.timerRemaining = 0; S.timerDuration = 180;
      if(prefs.discussion) { S.phase = "discussion"; log("อภิปรายก่อนคืนแรก"); }
      else beginNight();
      tab = "home";
      commit();
    });
  }

  function previousTarget(rid) {
    if (!['guard','seer'].includes(rid)) return '';
    return S.previousNightTargets?.night === S.night - 1
      ? S.previousNightTargets[rid] || '' : '';
  }

  function beginNight() {
    S.previousNightTargets = {
      night: S.night,
      guard: S.night > 0 && !S.actions.guard?.skip ? S.actions.guard?.target || '' : '',
      seer: S.night > 0 && !S.actions.seer?.skip ? S.actions.seer?.target || '' : ''
    };
    
    S.doubleAttack = !!S.cubPending;
    S.cubPending = false;
    S.silenced = "";

    S.night++;
    
    S.phase = "night";
    S.step = 0;
    S.actions = {};
    S.votes = {};
    S.deaths = [];
    S.timerEnd = 0; S.timerRemaining = 0;
    S.voted = false;

    S.queue = S.roles
      .filter(r=>
        r.order>0 &&

        !(
          r.id==="wolf" &&
          S.wolfBlockedNight===S.night
        ) &&

        (!r.firstOnly||S.night===1) &&
        
        alive().some(p=>
          r.id==="wolf"
            ?isWolf(p)
            :p.roleId===r.id
        )
    
      )
      .sort((a,b)=>a.order-b.order)
      .map(r=>r.id);

    log("เริ่มคืนที่ "+S.night);

    if(S.wolfBlockedNight===S.night) {

      specialAlert(
        "🦠 คืนนี้หมาป่างดโจมตี",
        "หมาป่าติดเชื้อ "+
        "ระบบข้ามลำดับการโจมตีให้อัตโนมัติ"
      );
    }
  }

  function nextNight() {

    if (hasPendingHunter()) {
      return openHunter();
    }

    if(S.phase!=="day") return;

    ask(
      S.voted
        ?"เข้าสู่คืนถัดไป?"
        :"ยังไม่ได้โหวต ต้องการข้ามหรือไม่?",
      ()=>{
        snapshot();
        beginNight();
        tab = "home";
        commit();
      }
    );
  }

  function nightAction(skip=false) {

    if (hasPendingHunter()) {
      return openHunter();
    }

    if(S.phase!=="night") return;

    const r = role(S.queue[S.step]);

    if(!r.id) return;

    const data = {skip:skip};

    if(!skip) {

      
      if(r.id==="cupid") {

        data.lover1 =
          $("lover1")?.value || "";

        data.lover2 =
          $("lover2")?.value || "";

        if (
          !player(data.lover1)?.alive ||
          !player(data.lover2)?.alive
        ) {
          return notice(
            "กรุณาเลือกคู่รักให้ครบ 2 คน"
          );
        }

        if (
          data.lover1===data.lover2
        ) {
          return notice(
            "ไม่สามารถเลือกคนเดียวกันได้"
          );
        }

        data.note =
          nameOf(data.lover1)+
          " ❤️ "+
          nameOf(data.lover2);

      } else if(r.action==="revealWolves") {
        data.note = alive()
          .filter(isWolf)
          .map(p=>p.name).join(", ");

      } else if(r.action==="witch") {

        data.heal = Boolean(
          $("heal")?.checked &&
          S.potions.heal
        );

        data.poison = S.potions.poison
          ?$("poison")?.value||""
          :"";

        if(data.heal &&
           !S.actions.wolf?.target) {
          return notice(
            "ไม่มีเหยื่อให้รักษา"
          );
        }

      } else if(
        r.action==="custom" ||
        r.action==="none"
      ) {
        data.note =
          $("customNote")?.value||"";

      } else {
        data.target =
          $("target")?.value||"";

        
        if(r.action==="kill" &&
           S.doubleAttack) {

          data.target2 =
            $("target2")?.value||"";

          if(data.target2 &&
             data.target2===data.target) {
            return notice(
              "ต้องเลือกเหยื่อคนละคน"
            );
          }
        }

        if(r.action==="copy") {
          const actors = alive().filter(
            p=>p.roleId===r.id
          );

          if(actors.length!==1) {
            return notice(
              "ระบบรองรับภูตจำแลงหนึ่งคนต่อเกม"
            );
          }

          if(actors[0].id===data.target) {
            return notice(
              "ไม่สามารถเลือกตัวเอง"
            );
          }
        }

        if (data.target && data.target === previousTarget(r.id)) {
          return notice("ไม่สามารถเลือกคนเดิมกับคืนก่อน กรุณาเลือกคนอื่น");
        }
        if (data.target && !player(data.target)?.alive) {
          return notice("กรุณาเลือกผู้เล่นที่ยังรอดชีวิต");
        }
        if(!data.target) {
          return notice(
            "เลือกเป้าหมายหรือกดข้าม"
          );
        }
      }
    }

    snapshot();

    
    S.actions[r.id] = data;

    if (
      r.id==="cupid" &&
      !skip &&
      data.lover1 &&
      data.lover2
    ) {

      S.lovers = [
        data.lover1,
        data.lover2
      ];

      log(
        "💘 กามเทพจับคู่ "+
        nameOf(data.lover1)+
        " กับ "+
        nameOf(data.lover2)
      );
    }

    if(!skip && data.target) {

      if(r.action==="silence") {
        S.silenced = data.target;
      }

      if(r.action==="copy") {
        const actor = alive().find(
          p=>p.roleId===r.id
        );

        if(actor) {
          actor.copyTarget = data.target;
        }
      }

      if(r.action==="reveal") {
        const target = player(data.target);
        const actor = alive().find(
          p=>p.roleId===r.id
        );

        if(isWolf(target)) {
          data.victim = target.id;
        } else if(actor) {
          data.victim = actor.id;
        }
      }
    }
    

    if(data.heal) S.potions.heal = false;
    if(data.poison) S.potions.poison = false;

    let detail = skip
      ?"ข้าม"
      :data.target
        ?nameOf(data.target)
        :data.note||"ดำเนินการแล้ว";

    if(r.action==="witch"&&!skip) {
      detail =
        "รักษา: "+
        (data.heal?"ใช้":"ไม่ใช้")+
        " / พิษ: "+
        nameOf(data.poison);
    }

    log(r.name+" : "+detail);

    let result = "";

    if(r.action==="inspect"&&data.target) {
      const p = player(data.target);

      if(p) {
        result = p.name+" อยู่ฝ่าย "+
          teamName(role(p.roleId).team);
      }
    }

    S.step++;
    commit();

    if(result) {
      notice(result,"🔮 ผลการตรวจสอบ");
    }
  }

  function resolveNight() {

    if (hasPendingHunter()) {
      return openHunter();
    }

    if(S.phase!=="night" ||
       S.step<S.queue.length) return;

    ask("สรุปผลกลางคืน?",()=>{
      snapshot();

      const wolfBlocked =
        S.wolfBlockedNight===S.night;

      const wolf = wolfBlocked
        ?null
        :S.actions.wolf?.target;
      const guard = S.actions.guard?.target;
      const witch = S.actions.witch||{};
      const deaths = new Set();
      const wolfVictims = new Set();

      
      const wolfTargets = [
        wolf,
        (wolfBlocked
          ?null
          :S.actions.wolf?.target2)
      ].filter(Boolean);

      wolfTargets.forEach((id,index)=>{
        if(id===guard) return;
        if(index===0 && witch.heal) return;

        const p = player(id);

        if(!p?.alive) return;

        if(p.roleId==="cursed") {

          transformCursed(p);

        } else if(
          p.roleId==="toughGuy"
        ) {

          if(!p.toughDueNight) {

            p.toughDueNight =
              S.night+1;

            specialAlert(
              "💪 หนุ่มถึกถูกโจมตี",
              p.name+
              " ยังรอดชีวิต "+
              "และจะเสียชีวิตในคืนที่ "+
              p.toughDueNight
            );
          }

        } else {

          deaths.add(id);
          wolfVictims.add(id);
        }
      });

      if(S.actions.revealer?.victim) {
        deaths.add(
          S.actions.revealer.victim
        );
      }
    

      if(witch.poison) {
        deaths.add(witch.poison);
      }

      alive().forEach(p=>{

        if(
          p.toughDueNight>0 &&
          p.toughDueNight<=S.night
        ) {

          deaths.add(p.id);

          specialAlert(
            "💪 หนุ่มถึกครบกำหนด",
            p.name+
            " เสียชีวิตจากการโจมตีของหมาป่าในคืนก่อน"
          );
        }
      });

      S.deaths = [];

      const messages = [];

      deaths.forEach(id=>{
        const p = player(id);

        if(p?.alive) {
          S.deaths.push(p.name);

          const infected =
            p.roleId==="diseased" &&
            wolfVictims.has(p.id);

          const msg = killPlayer(
            p,
            wolfVictims.has(p.id)
              ?"ถูกหมาป่ากำจัด"
              :"กลางคืน"
          );

          if(infected && !p.alive) {

            S.wolfBlockedNight =
              S.night+1;

            specialAlert(
              "🦠 หมาป่าติดเชื้อ",
              p.name+
              " ถูกหมาป่ากำจัด "+
              "หมาป่าจะโจมตีไม่ได้ในคืนที่ "+
              S.wolfBlockedNight
            );
          }

          if(msg) messages.push(msg);
        }
      });

      if(!S.deaths.length) {
        log("คืนนี้ไม่มีผู้เสียชีวิต");
      }

      S.phase = "day";
      S.votes = {};
      S.voted = false;

      commit();

      if(messages.length) {
        notice(messages.join(" / "));
      }
    });
  }

  // =========================
  // VOTE
  // =========================

  function vote(id,delta) {
    if(S.phase!=="day" ||
       S.voted ||
       !player(id)?.alive) return;

    const total = Object.values(S.votes)
      .reduce((a,b)=>a+b,0);

    if(delta>0 &&
       total>=alive().length) {
      return notice(
        "คะแนนครบจำนวนผู้รอดชีวิตแล้ว"
      );
    }

    snapshot();

    S.votes[id] = Math.max(
      0,(S.votes[id]||0)+delta
    );

    commit();
  }

  function resetVotes() {
    if(S.voted) return;

    ask("ล้างคะแนนทั้งหมด?",()=>{
      snapshot();
      S.votes = {};
      commit();
    });
  }

  function executeVote() {

    if (hasPendingHunter()) {
      return openHunter();
    }

    if(S.phase!=="day"||S.voted) return;

    const list = alive().map(p=>({
      id:p.id,
      votes:S.votes[p.id]||0
    })).sort((a,b)=>b.votes-a.votes);

    if(!list.length||!list[0].votes) {
      return notice("ยังไม่มีคะแนนโหวต");
    }

    if(list[1]?.votes===list[0].votes) {
      return notice(
        "คะแนนเสมอ กรุณาโหวตใหม่"
      );
    }

    const p = player(list[0].id);

    ask(
      "กำจัด "+p.name+" ด้วย "+
      list[0].votes+" คะแนน?",
      ()=>{
        snapshot();

        log(p.name+" ได้รับ "+
          list[0].votes+" คะแนน");

        const msg = killPlayer(
          p,"ถูกโหวต"
        );

        S.voted = true;
        S.votes = {};
        S.timerEnd = 0; S.timerRemaining = 0;
        tab = "home";

        commit();

        if(msg) notice(msg);
      }
    );
  }

  // =========================
  // WINNER / RESET
  // =========================

  function winner() {
    if(hasPendingHunter()) return "";
    if(S.phase!=="day") return "";

    const list = alive();

    
    const wolves = list.filter(isWolf).length;

    const wolfTeam = list.filter(p=>
      role(p.roleId).team==="wolf"
    ).length;
    

    const neutral = list.filter(p=>
      role(p.roleId).team==="neutral"
    ).length;

    if(!list.length) {
      return "ไม่มีผู้รอดชีวิต";
    }

    if(neutral) return "";
    if(!wolves) return "ฝ่ายชาวบ้าน";

    if(wolfTeam>=list.length-wolfTeam) {
      return "ฝ่ายหมาป่า";
    }

    return "";
  }

  function endGame() {

    if (hasPendingHunter()) {
      return openHunter();
    }

    if(S.phase==="setup") {
      return notice("ยังไม่ได้เริ่มเกม");
    }

    const w = winner();

    showModal(
      "กำหนดผู้ชนะ",
      `
      <select id="win">
        ${[
          "ฝ่ายชาวบ้าน",

          "เสมอ",

          <option ${x===w?"selected":""}>

      </select>

      ()=>{

  }

  // =========================
  // TIMER
  // =========================

  function unlockAudio() {
    try { const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; audio ||= new AC(); audio.resume().catch(()=>{}); } catch(e) {}
  }
  function beep(final=false) {
    if(!prefs.sound || !audio || audio.state!=="running") return;
    try { const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=final?880:550; g.gain.value=.12; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+(final?.65:.2)); } catch(e) {}
  }
  function timerStart(minutes) {
    if(!["day","discussion"].includes(S.phase)) return;
    unlockAudio(); snapshot(); S.timerDuration=Math.round(minutes*60); S.timerRemaining=0; S.timerEnd=Date.now()+S.timerDuration*1000; commit(); tick();
  }
  function timerStop() { if(!S.timerEnd) return; snapshot(); S.timerRemaining=Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000)); S.timerEnd=0; commit(); tick(); }
  function timerResume() { unlockAudio(); if(!S.timerRemaining) return; snapshot(); S.timerEnd=Date.now()+S.timerRemaining*1000; S.timerRemaining=0; commit(); tick(); }
  function timerReset() { snapshot(); S.timerEnd=0; S.timerRemaining=S.timerDuration||180; commit(); tick(); }
  function timerCustom() { showModal("กำหนดเวลา", '<label>นาที (1–120)</label><input id="customMinutes" type="number" min="1" max="120" value="3">',()=>{const n=Number($("customMinutes").value); if(!Number.isInteger(n)||n<1||n>120)return formError("กรอก 1–120 นาที"); closeModal(); timerStart(n);},"เริ่มจับเวลา"); }
  function timerPanel() { return `<h3>⏱ เวลาอภิปราย</h3><div class="timer" id="timer">00:00</div><div class="row">${[1,3,5,10].map(n=>btn(n+" นาที","timerStart("+n+")","grow mini")).join("")}</div>${btn("กำหนดเวลาเอง","timerCustom()","full")}<div class="row" style="margin-top:8px">${btn(S.timerEnd?"หยุดชั่วคราว":"เล่นต่อ",S.timerEnd?"timerStop()":"timerResume()","grow")}${btn("รีเซ็ต","timerReset()","grow")}</div>`; }
  function tick() {
    const sec=S.timerEnd?Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000)):(S.timerRemaining||0);
    const el=$("timer"); if(el){el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");el.style.color=S.timerEnd&&sec<=10?"#f08090":"#ffffff";}
    if(S.timerEnd&&sec>0&&sec<=10&&prefs.warning&&warnedEnd!==S.timerEnd){warnedEnd=S.timerEnd;beep();}
    if(S.timerEnd&&sec===0){S.timerEnd=0;S.timerRemaining=0;beep(true);commit();if(!$("modal").innerHTML)notice("⏰ หมดเวลาอภิปราย");else status="หมดเวลาอภิปราย";}
  }
  function firstNight() { if(S.phase!=="discussion")return; ask("สิ้นสุดการอภิปรายและเริ่มคืนที่ 1?",()=>{snapshot();beginNight();tab="home";commit();}); }
  function cue() {
    if(S.phase==="discussion")return ["discussion","ขอให้ทุกคนลืมตา และเริ่มอภิปรายก่อนคืนแรก"];
    if(S.phase==="setup"&&S.registration){const r=role(S.registration.queue[S.registration.step]);return ["reg"+S.registration.step,r.id?"ขอให้ "+r.name+" ลืมตาขึ้นมา ให้ผู้ดำเนินเกมเห็นว่าเป็นใคร":"ลงทะเบียนครบแล้ว"];} 
    if(S.phase==="night"){const r=role(S.queue[S.step]);return ["night"+S.night+":"+S.step,(S.step===0?"ขอให้ทุกคนหลับตา ":"ขอให้บทบาทก่อนหน้าหลับตา ")+(r.id?(r.speech||r.name+" ลืมตา"):"รอสรุปผลกลางคืน")];}
    if(S.phase==="day")return ["day"+S.night,"ขอให้ทุกคนลืมตา เตรียมอภิปราย"];
    return [S.phase,""];
  }
  function speakCue(manual=true){const t=cue()[1];if(!t)return;if(!window.speechSynthesis){if(manual)notice("อุปกรณ์ไม่รองรับเสียงพูด");return;} try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="th-TH";u.rate=Number(prefs.rate)||1;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith("th"));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){if(manual)notice("ไม่สามารถอ่านเสียงได้");}}
  function syncCue(){const k=cue()[0];if(k!==lastCue){lastCue=k;if(prefs.autoSpeech)speakCue(false);}}
  async function keepAwake(){try{if(prefs.awake&&document.visibilityState==="visible"&&navigator.wakeLock){if(!wakeLock||wakeLock.released)wakeLock=await navigator.wakeLock.request("screen");}else if(wakeLock){await wakeLock.release();wakeLock=null;}}catch(e){}}
  function settingsPage(){return card(`<h2>⚙️ ตั้งค่า V2.3</h2>${[["autoSpeech","อ่านบทพูดอัตโนมัติ"],["sound","เสียงเตือน"],["warning","เตือนก่อนหมดเวลา 10 วินาที"],["awake","ป้องกันหน้าจอดับ"],["discussion","อภิปรายก่อนคืนแรก"]].map(([k,t])=>`<label class="check"><input type="checkbox" ${prefs[k]?"checked":""} onchange="setPref('${k}',this.checked)">${t}</label>`).join("")}<label>ความเร็วเสียงพูด</label><select onchange="setPref('rate',Number(this.value))">${[.75,1,1.25,1.5].map(n=>`<option ${prefs.rate===n?"selected":""} value="${n}">${n}x</option>`).join("")}</select>${btn("ทดสอบเสียง","testSound()","full")}${btn("สำรองข้อมูลเกม","backupGame()","full")}<label class="check">กู้คืนข้อมูลเกม<input type="file" accept=".json,application/json" onchange="restoreGame(this)"></label><p class="notice">เสียงและการเปิดหน้าจอขึ้นกับการรองรับของ iOS</p>`);}
  function setPref(k,v){prefs[k]=v;try{localStorage.setItem("WerewolfSettings21",JSON.stringify(prefs));}catch(e){notice("บันทึกการตั้งค่าไม่สำเร็จ");}if(k==="autoSpeech"&&!v)window.speechSynthesis?.cancel();if(k==="awake")keepAwake();unlockAudio();}
  function testSound(){unlockAudio();if(window.speechSynthesis){const u=new SpeechSynthesisUtterance("ทดสอบเสียงผู้ดำเนินเกม");u.lang="th-TH";u.rate=prefs.rate;speechSynthesis.speak(u);}beep(true);}
  function backupGame(){const a=document.createElement("a");const url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.href=url;a.download="werewolf-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
  async function restoreGame(input){try{const x=JSON.parse(await input.files[0].text());if(!x||!Array.isArray(x.players)||!Array.isArray(x.roles)||!Array.isArray(x.history)||!Array.isArray(x.queue)||!x.votes||!x.actions||!x.potions||!x.players.every(p=>typeof p.id==="string"&&typeof p.name==="string"&&typeof p.alive==="boolean")||!x.roles.every(r=>typeof r.id==="string"&&typeof r.name==="string")||!["setup","discussion","night","day","ended"].includes(x.phase))throw Error();ask("แทนที่ข้อมูลเกมปัจจุบัน?",()=>{S={...fresh(),...x,version:2.3,undo:[]};tab="home";commit();if(hasPendingHunter())scheduleHunter();});}catch(e){notice("ไฟล์สำรองไม่ถูกต้อง");}input.value="";}
  document.addEventListener("visibilitychange",keepAwake);
  Object.assign(window,{timerResume,timerReset,timerCustom,firstNight,speakCue,setPref,testSound,backupGame,restoreGame});

  function scheduleHunter() {

    if (hunterTimer !== null) {
      clearTimeout(hunterTimer);
    }

    hunterTimer = setTimeout(() => {

      hunterTimer = null;

      if (
        S.phase === "setup" ||
        S.phase === "ended"
      ) return;

      if (hasPendingHunter()) {
        openHunter();
      }

    }, 180);

  function transformDoppelganger(dead) {

    if (!dead || dead.alive) return;

    const actors = alive().filter(p =>
      p.roleId === "doppelganger" &&
      p.copyTarget === dead.id
    );

    actors.forEach(actor => {

      const oldRole = actor.roleId;
      const newRole = dead.roleId;

      if (!role(newRole).id) return;

      actor.originalRoleId =
        actor.originalRoleId || oldRole;

      actor.roleId = newRole;

      delete actor.copyTarget;

      actor.transformedFrom = dead.name;
      actor.transformedNight = S.night;

      if (!Array.isArray(S.copyNotices)) {
        S.copyNotices = [];
      }

      S.copyNotices.push({
        id: uid(),
        player: actor.name,
        target: dead.name,
        roleId: newRole,
        night: S.night
      });

      log(
        "🎭 " + actor.name +
        " สวมรอยเป็น " +
        role(newRole).name +
        " แทน " + dead.name
      );

    });
  }

  function registrationState() {

  function openRegistration() {

    if(S.phase !== "setup") {
      return notice(
        "ใช้ได้ก่อนเริ่มเกมเท่านั้น"
      );
    }

    if(S.players.length < 3) {
      return notice(
        "กรุณาเพิ่มผู้เล่นอย่างน้อย 3 คน"
      );
    }

    const counts = {};

    S.players.forEach(p=>{
      if(p.roleId) {
        counts[p.roleId] =
          (counts[p.roleId] || 0) + 1;
      }
    });

    const old = registrationState();

    if(old && old.counts) {
      Object.assign(counts, old.counts);
    }

    showModal(
      "🎭 เลือกบทบาทในเกม",
      `
      <div class="speech">
        ผู้เล่นทั้งหมด:
        <b>${S.players.length} คน</b>
        <br>
        เลือกจำนวนการ์ดที่ใช้จริง
      </div>

      <div class="item gold"
        id="registrationTotal">
        จำนวนการ์ดที่เลือก
      </div>

      ${S.roles.map((r,i)=>`
        <div class="item row between">

          <div class="grow">
            ${esc(r.icon+" "+r.name)}
          </div>

          ${btn(
            "−",
            "adjustRegistration("+i+",-1)",
            "mini"
          )}

          <input
            id="regCount_${i}"
            class="count"
            type="number"
            min="0"
            max="${S.players.length}"
            value="${counts[r.id]||0}"
            oninput="updateRegistrationTotal()"
          >

          ${btn(
            "+",
            "adjustRegistration("+i+",1)",
            "mini"
          )}

        </div>
      `).join("")}

      <p class="notice">
        จำนวนที่เหลือจะเป็นชาวบ้าน
        โดยอัตโนมัติ
      </p>
      `,
      ()=>{

        const selected = {};
        let total = 0;

        for(let i=0;i<S.roles.length;i++) {

          const n = Number(
            $("regCount_"+i).value
          );

          if(
            !Number.isInteger(n) ||
            n<0 ||
            n>S.players.length
          ) {
            return formError(
              "จำนวนบทบาทไม่ถูกต้อง"
            );
          }

          if(n>0) {
            selected[S.roles[i].id] = n;
          }

          total += n;
        }

        if(total>S.players.length) {
          return formError(
            "จำนวนการ์ดมากกว่าผู้เล่น"
          );
        }

        selected.villager =
          (selected.villager||0) +
          S.players.length-total;

        if(
          !(selected.wolf||0) &&
          !(selected.wolfCub||0)
        ) {
          return formError(
            "ต้องมีหมาป่าอย่างน้อย 1 คน"
          );
        }

        if(!S.roles.some(r=>
          r.team==="village" &&
          selected[r.id]>0
        )) {
          return formError(
            "ต้องมีฝ่ายชาวบ้าน"
          );
        }

        const queue = S.roles
          .filter(r=>
            selected[r.id]>0 &&
            r.id!=="villager"
          )
          .map(r=>r.id);

        snapshot();

        S.registration = {
          counts:selected,
          queue:queue,
          step:0,
          assignments:{},
          playerIds:S.players.map(p=>p.id),
          complete:false
        };

        closeModal();

        tab = "home";

        commit();

        notice(
          "แจกการ์ดให้ผู้เล่นเรียบร้อย "+
          "จากนั้นให้ทุกคนหลับตา "+
          "และเริ่มเรียกทีละบทบาท",
          "🌙 เตรียมลงทะเบียน"
        );
      },
      "เริ่มลงทะเบียน"
    );

    updateRegistrationTotal();
  }

  function adjustRegistration(i,delta) {

    const el = $("regCount_"+i);

    if(!el) return;

    el.value = Math.max(
      0,
      Math.min(
        S.players.length,
        (Number(el.value)||0)+delta
      )
    );

    updateRegistrationTotal();
  }

  function updateRegistrationTotal() {

    let total = 0;

    S.roles.forEach((r,i)=>{
      total += Number(
        $("regCount_"+i)?.value||0
      );
    });

    const el = $("registrationTotal");

    if(el) {

      const left = S.players.length-total;

      el.textContent =
        "เลือกแล้ว "+total+
        " / "+S.players.length+
        (left>0
          ?" · เหลือ "+left+" ชาวบ้าน"
          :"");

      el.className =
        "item "+
        (left<0?"red":left===0?"green":"gold");
    }
  }

  function validRegistration() {

    const reg = registrationState();

    if(!reg) return false;

    return reg.playerIds.length ===
      S.players.length &&
      reg.playerIds.every(id=>player(id)) &&
      Object.keys(reg.counts).every(
        id=>S.roles.some(r=>r.id===id)
      );
  }

  function checkRegistration(el) {

    const reg = registrationState();

    if(!reg) return;

    const rid = reg.queue[reg.step];
    const limit = reg.counts[rid];

    const boxes = Array.from(
      document.querySelectorAll(
        ".registrationCheck"
      )
    );

    let count = boxes.filter(
      x=>x.checked
    ).length;

    if(count>limit && el) {
      el.checked = false;
      count--;
    }

    const label = $("regSelected");

    if(label) {
      label.textContent =
        "เลือกแล้ว "+count+
        " / "+limit+" คน";

      label.className =
        "item "+
        (count===limit?"green":"gold");
    }
  }

  function confirmRegistration() {

    const reg = registrationState();

    if(!validRegistration() ||
       S.phase!=="setup") return;

    const rid = reg.queue[reg.step];

    const ids = Array.from(
      document.querySelectorAll(
        ".registrationCheck:checked"
      )
    ).map(x=>x.value);

    if(ids.length!==reg.counts[rid]) {

      return notice(
        "กรุณาเลือกผู้เล่นให้ครบ "+
        reg.counts[rid]+" คน"
      );
    }

    if(ids.some(id=>
      !player(id) ||
      (
        reg.assignments[id] &&
        reg.assignments[id]!==rid
      )
    )) {
      return notice(
        "พบผู้เล่นที่ลงทะเบียนแล้ว"
      );
    }

    snapshot();

    Object.keys(reg.assignments)
      .forEach(id=>{
        if(reg.assignments[id]===rid) {
          delete reg.assignments[id];
        }
      });

    ids.forEach(id=>{
      reg.assignments[id] = rid;
    });

    reg.step++;

    reg.complete =
      reg.step>=reg.queue.length;

    commit();

    notice(
      role(rid).name+
      " ลงทะเบียนเรียบร้อย "+
      "ให้หลับตาลงได้",
      "✓ บันทึกแล้ว"
    );
  }

  function previousRegistration() {

    const reg = registrationState();

    if(!reg || reg.step<=0) {

      return openRegistration();
    }

    snapshot();

    reg.step--;
    reg.complete = false;

    const rid = reg.queue[reg.step];

    Object.keys(reg.assignments)
      .forEach(id=>{
        if(reg.assignments[id]===rid) {
          delete reg.assignments[id];
        }
      });

    commit();
  }

  function finishRegistration() {

    const reg = registrationState();

    if(!validRegistration() ||
       S.phase!=="setup") return;

    if(reg.step<reg.queue.length) {
      return notice(
        "ยังลงทะเบียนไม่ครบ"
      );
    }

    const actual = {};

    S.players.forEach(p=>{

      const rid =
        reg.assignments[p.id] ||
        "villager";

      actual[rid] =
        (actual[rid]||0)+1;
    });

    if(S.roles.some(r=>
      (actual[r.id]||0)!==
      (reg.counts[r.id]||0)
    )) {
      return notice(
        "จำนวนบทบาทไม่ตรง กรุณาตรวจสอบ"
      );
    }

    ask(
      "ยืนยันบทบาทผู้เล่นทั้งหมด "+
      S.players.length+" คน?",
      ()=>{

        snapshot();

        S.players.forEach(p=>{

          p.roleId =
            reg.assignments[p.id] ||
            "villager";

          p.originalRoleId = p.roleId;
          p.alive = true;

          delete p.copyTarget;
        });

        delete S.registration;

        log(
          "ลงทะเบียนบทบาทแบบหลับตาครบแล้ว"
        );

        tab = "home";

        commit();

        startGame();
      }
    );
  }

  function cancelRegistration() {

    ask(

      ()=>{

        snapshot();

        delete S.registration;

        commit();
      }
    );
  }

    tab = t;
    render();
    window.scrollTo(0,0);
  }

  // =========================
  // MAIN RENDER
  // =========================

  function render() {

    const pages = {
      home:homePage,
      players:playersPage,
      roles:rolesPage,
      vote:votePage,
      history:historyPage, settings:settingsPage, more:morePage
    };

    if(S.phase!=="day" || S.voted) votingOpen=false;
    const nav = [
      ["home","🏠","ดำเนินเกม"],
      ["players","👥","ผู้เล่น"],
      ["more","☰","เพิ่มเติม"]
    ];

    const phase = {
      setup:"เตรียมเกม", discussion:"อภิปรายก่อนเกม",
      night:"🌙 คืนที่ "+S.night,
      day:"☀️ วันที่ "+S.night,
      ended:"จบเกม"
    }[S.phase];

    $("app").innerHTML = `
      <header class="row between">
        <div>
          <h1>🐺 WEREWOLF</h1>

          <div class="subtitle">
            MODERATOR WEB APP V2.3
          </div>
        </div>

        <div class="badge">
          ${esc(phase)}
        </div>
      </header>

      <div class="stats">

        <div class="stat">
          <strong>${S.players.length}</strong>
          <small>ผู้เล่นทั้งหมด</small>
        </div>

        <div class="stat">
          <strong class="green">
            ${alive().length}
          </strong>
          <small>รอดชีวิต</small>
        </div>

        <div class="stat">
          <strong class="red">
            ${S.players.length-alive().length}
          </strong>
          <small>เสียชีวิต</small>
        </div>

      </div>

      <div class="row between toolbar">
        <span id="saveStatus"
          class="small muted">
          ● ${esc(status)}
        </span>

        ${btn("↩ ย้อนกลับ",
          "undo()","mini")}
      </div>

      ${tab==="home"&&cue()[1]?btn("🔊 อ่านบทพูด / อ่านซ้ำ","speakCue()","full"):""}
      ${["roles","history","settings"].includes(tab)?btn("‹ กลับเมนูเพิ่มเติม",call("go","more"),"full"):""}
      ${pages[tab]()}

      <nav>
        ${nav.map(n=>`
          <button
            class="${(tab===n[0] || (n[0]==="more" && ["roles","history","settings"].includes(tab)))
              ?"active":""}"
            onclick="${esc(call("go",n[0]))}">

            <span>${n[1]}</span>
            ${n[2]}

          </button>
        `).join("")}
      </nav>
    `;
  }

  // เปิดให้ HTML เรียกฟังก์ชันได้

  Object.assign(window,{

    clearPlayers,
    closeModal,
    submitModal,
    undo,
    editPlayer,
    quickAdd,
    deletePlayer,
    changeLife,
    shuffleRoles,
    editRole,
    deleteRole,
    startGame,
    nightAction,
    resolveNight,
    nextNight,
    vote,
    resetVotes,
    executeVote,
    endGame,
    resetGame,
    timerStart,
    timerStop,
    toggleInlineVote,
    go
  });

  render();
  lastCue=cue()[0]; keepAwake();
  tick();
  setInterval(tick,250);

    if (
      S.phase !== "setup" &&
      S.phase !== "ended" &&
      hasPendingHunter()
    ) {
      scheduleHunter();
    }
}

    let game = fresh();

    try {
      const saved = localStorage.getItem(
        "WerewolfMasterV2"
      );

      if (saved) {
        const old = JSON.parse(saved);

        if (
          Array.isArray(old.players) &&
          Array.isArray(old.roles)
        ) {
          game = Object.assign(game, old);
        }
      }
    } catch(e) {
      console.log(e);
    }

    game.version = 2.3;

    dashboard(game);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("./sw.js")
        .catch(console.log);
    }
  </script>

</body>
</html>
