
<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,viewport-fit=cover">

<style>

:root {
  color-scheme:dark;
  --bg:#11131c;
  --card:#1c202d;
  --line:#303647;
  --text:#f3f4fa;
  --muted:#969eb3;
  --green:#65d6a5;
  --red:#f08090;
  --blue:#8faaff;
  --gold:#f2c879;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  padding:
    calc(18px + env(safe-area-inset-top))
    14px
    calc(110px + env(safe-area-inset-bottom));
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,
    BlinkMacSystemFont,sans-serif;
  font-size:14px;
}

h1,h2,h3,p {
  margin:0;
}

h1 {
  font-size:24px;
}

h2 {
  font-size:17px;
  margin-bottom:10px;
}

h3 {
  font-size:15px;
}

p {
  line-height:1.6;
}

header {
  margin-bottom:18px;
}

.subtitle {
  font-size:10px;
  letter-spacing:2px;
  color:var(--muted);
  margin-top:5px;
}

.badge {
  background:#30384f;
  color:var(--blue);
  border-radius:10px;
  padding:9px;
  font-size:12px;
  white-space:nowrap;
}

.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  margin-bottom:12px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 4px;
  text-align:center;
}

.stat strong {
  display:block;
  font-size:28px;
  margin-bottom:5px;
}

small,.muted {
  color:var(--muted);
}

small,.small {
  font-size:12px;
}

.green {
  color:var(--green);
}

.red {
  color:var(--red);
}

.blue {
  color:var(--blue);
}

.gold {
  color:var(--gold);
}

.row {
  display:flex;
  align-items:center;
  gap:8px;
}

.between {
  justify-content:space-between;
}

.grow {
  flex:1;
  min-width:0;
}

.toolbar {
  margin-bottom:12px;
}

.moderator-tools {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin: 0 0 14px;
}
.moderator-tools button {
  min-height:44px;
  padding:10px 8px;
  font-size:13px;
  width:100%;
}

button,input,textarea,select {
  font:inherit;
  color:var(--text);
}

button {
  border:0;
  background:#30374b;
  border-radius:10px;
  padding:12px;
  font-weight:600;
  touch-action:manipulation;
  cursor:pointer;
}

button:active {
  opacity:.65;
}

.primary {
  background:#5269b8;
  color:white;
}

.success {
  background:#21483e;
  color:var(--green);
}

.danger {
  background:#492a37;
  color:var(--red);
}

.mini {
  font-size:12px;
  padding:9px 10px;
  white-space:nowrap;
}

.full {
  width:100%;
  margin-top:9px;
}

input,select,textarea {
  background:#141722;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  width:100%;
  margin:6px 0 12px;
  font-size:16px;
}

textarea {
  min-height:80px;
}

label {
  color:var(--muted);
  font-size:13px;
}

.check {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
}

.check input {
  width:22px;
  height:22px;
  margin:0;
}

.count {
  width:75px;
  margin:0;
}

.item {
  border-bottom:1px solid var(--line);
  padding:12px 0;
}

.item:last-child {
  border-bottom:0;
}

.avatar {
  width:39px;
  height:39px;
  border-radius:11px;
  background:#30374b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  flex-shrink:0;
}

.dead .avatar,
.dead .playerName {
  opacity:.45;
}

.dead .playerName {
  text-decoration:line-through;
}

.speech {
  background:#141722;
  border-left:3px solid var(--blue);
  border-radius:8px;
  padding:14px;
  margin:12px 0;
  line-height:1.7;
}

.progress {
  height:6px;
  border-radius:8px;
  background:#303647;
  overflow:hidden;
  margin:10px 0;
}

.progress div {
  height:100%;
  background:var(--green);
}

.timer {
  font-size:48px;
  text-align:center;
  font-weight:750;
  font-variant-numeric:tabular-nums;
  padding:16px;
}

.voteNumber {
  min-width:28px;
  text-align:center;
  font-size:20px;
}

nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:#191d29;
  border-top:1px solid var(--line);
  padding:8px 5px
    calc(10px + env(safe-area-inset-bottom));
  z-index:10;
}

nav button {
  flex:1;
  padding:5px 0;
  background:transparent;
  color:var(--muted);
  font-size:10px;
}

nav button.active {
  color:var(--blue);
}

nav span {
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal {
  width:100%;
  max-width:480px;
  max-height:75vh;
  overflow:auto;
  background:#222736;
  border:1px solid #41495d;
  border-radius:20px;
  padding:20px;
  box-shadow:0 15px 50px #0008;
}

.modalButtons {
  margin-top:15px;
}

.modalButtons button {
  min-height:44px;
}

.notice {
  color:var(--gold);
  font-size:12px;
  line-height:1.6;
  margin:10px 0;
}

.notice.red {
  color:var(--red);
}

.empty {
  color:var(--muted);
  text-align:center;
  padding:25px 5px;
}


.clearArea {
  border-top:1px solid var(--line);
  margin-top:16px;
  padding-top:14px;
}

.clearButton {
  width:100%;
  background:transparent;
  border:1px solid #70404b;
  color:#f08090;
  border-radius:10px;
  padding:12px;
  font-size:13px;
  font-weight:500;
}

.clearButton:active {
  background:#492a37;
}


.clearRoleButton {
  width:100%;
  background:transparent;
  border:1px solid #5269b8;
  color:#8faaff;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  font-size:13px;
  font-weight:500;
}

.clearRoleButton:active {
  background:#30384f;
}


.reg557group{border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.reg557group summary{padding:12px;background:#2d3446;cursor:pointer;font-weight:600;list-style-position:inside}
.reg557badge{float:right;color:#aebbd5;font-size:12px}
.reg557row{padding:7px 9px;gap:6px}.reg557row .count{width:48px;text-align:center;padding:8px 3px}.reg557row button{min-width:32px;padding:7px}.reg557row .grow{min-width:0;overflow-wrap:anywhere;font-size:14px}
.reg557row[hidden],.reg557group[hidden]{display:none!important}
.reg557tools{margin:10px 0}.reg557tools input{margin-bottom:6px}
.reg557modal #registrationTotal{position:sticky;top:0;z-index:2;background:#222736;padding:9px 0}
.reg557modal .modalButtons{position:sticky;bottom:0;background:#222736;padding:8px 0;margin-top:8px;z-index:3}

</style>
<style id="retroBase13">
/* Retro RPG skin: presentation only; no layout or game state changes. */
:root{--bg:#101020;--card:#202039;--line:#555077;--text:#fff3d9;--muted:#b9b4cf;--green:#83e3ae;--red:#ff92a4;--blue:#a9baff;--gold:#f6d27d}
body{background-color:var(--bg);background-image:linear-gradient(90deg,#ffffff04 1px,transparent 1px),linear-gradient(#ffffff04 1px,transparent 1px);background-size:16px 16px}
header h1{color:var(--gold);letter-spacing:1px;text-shadow:2px 2px #76503d;font-family:ui-monospace,Menlo,monospace;font-weight:900}
.subtitle{color:#c2b2e0;letter-spacing:1.5px}
.card,.stat,.modal{border-radius:2px;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #141426,3px 3px 0 #080812;background-color:var(--card)}
.card h2,.modal h2{color:var(--gold)}
.stat strong,.timer,.voteNumber{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:-1px;text-shadow:2px 2px #101020}
.stat{background-image:linear-gradient(180deg,#ffffff06,transparent)}
.badge{border-radius:0;border:1px solid #8073a8;background:#30274a;color:var(--gold)}
button{border-radius:2px;background:#393451;box-shadow:inset 0 0 0 1px #71658c,0 3px 0 #0b0b18;color:var(--text)}
button.primary{background:#4c4383;box-shadow:inset 0 0 0 1px #b0a0ef,0 3px 0 #16112e;color:#fff3d9}
button.success{background:#244c40;box-shadow:inset 0 0 0 1px #64b58d,0 3px 0 #101b19;color:var(--green)}
button.danger{background:#572c40;box-shadow:inset 0 0 0 1px #b86a82,0 3px 0 #25101b;color:var(--red)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{border-radius:2px;background:#151529;border-color:#61567e;accent-color:#b4a0f0}
.speech{border-radius:0;background:#151529;border-left:4px solid var(--gold);box-shadow:inset 0 0 0 1px #403752}
.avatar{border-radius:2px;background:#393451;box-shadow:inset 0 0 0 1px #75638d}
.progress{border-radius:0;background:#151529;box-shadow:inset 0 0 0 1px #61567e}
.progress div{background:repeating-linear-gradient(90deg,#83e3ae 0 8px,#4c9d80 8px 10px)}
nav{background:#19182d;border-top:2px solid #8c754f}
nav button{background:transparent;box-shadow:none;color:var(--muted)}
nav button.active{color:var(--gold);background:#352d46;box-shadow:inset 0 0 0 1px #8c754f}
.modal{background:#202039;border-color:#8c754f;box-shadow:inset 0 0 0 2px #141426,4px 4px 0 #080812}
.reg557group{border-radius:2px;border-color:#61567e}
.reg557group summary{background:#393451;color:var(--gold)}
.reg557modal #registrationTotal,.reg557modal .modalButtons{background:#202039}
.clearButton,.clearRoleButton{border-radius:2px;background:transparent}

</style>

    return fn+"("+

  function showModal(
    title,body,action=null,
    buttonText="บันทึก"
  ) {
    modalAction = action;

    $("modal").innerHTML = `
      <div class="overlay">
        <div class="modal">
          <div class="row between">
            <h2>${esc(title)}</h2>
            ${btn("✕","closeModal()","mini")}
          </div>

          ${body}

          ${action?`
            <div class="row modalButtons">
              ${btn("ยกเลิก",
                "closeModal()","grow")}
              ${btn(buttonText,
                "submitModal()","primary grow")}
            </div>
          `:""}
        </div>
      </div>`;
  }

  function closeModal() {
    $("modal").innerHTML = "";
    modalAction = null;
  }

  function submitModal() {
    const action = modalAction;
    if(action) action();
  }

  function notice(message,title="แจ้งเตือน") {
    showModal(
      title,
      `<div class="speech">
        ${esc(message)}
      </div>
      ${btn("ตกลง",
        "closeModal()","primary full")}`
    );
  }

  // แจ้งข้อผิดพลาดโดยไม่ปิดฟอร์ม
  function formError(message) {
    let el = $("formError");

    if(!el) {
      el = document.createElement("div");
      el.id = "formError";
      el.className = "notice red";

      const box = document.querySelector(".modal");

      if(box) {
        box.appendChild(el);
      } else {
        notice(message);
        return;
      }
    }

    el.textContent = message;
    el.scrollIntoView({block:"nearest"});
  }

  function ask(message,action) {
    showModal(
      "ยืนยันการทำงาน",
      `<div class="speech">
        ${esc(message)}
      </div>`,
      ()=>{
        closeModal();
        action();
      },
      "ยืนยัน"
    );
  }

  function undo() {
    if(!S.undo?.length) {

    }

    ask("ย้อนกลับรายการล่าสุด?",()=>{

      S = stack.pop();
      S.undo = stack;
      tab = "home";

  function editPlayer(id="") {
    const p = player(id);

    if(!p && S.phase!=="setup") {
      return notice("เพิ่มผู้เล่นก่อนเริ่มเกม");
    }

    showModal(
      p?"แก้ไขผู้เล่น":"เพิ่มผู้เล่น",
      `
      <label>ชื่อผู้เล่น</label>
      <input id="pname"
        value="${esc(p?.name||"")}"
        placeholder="ชื่อเพื่อน">

      <label>บทบาท</label>
      <select id="prole">
        ${roleOptions(p?.roleId||"")}
      </select>
      `,
      ()=>{
        const name = $("pname").value.trim();
        const rid = $("prole").value;

        if(!name) {
          return formError("กรุณากรอกชื่อ");
        }

        if(S.players.some(x=>
          x.name===name && x.id!==id
        )) {
          return formError("ชื่อนี้มีอยู่แล้ว");
        }

        if(S.phase!=="setup" && !rid) {
          return formError("กรุณากำหนดบทบาท");
        }

        snapshot();

        if(p) {
          p.name = name;
          p.roleId = rid;
        } else {
          S.players.push({
            id:uid(),
            name:name,
            roleId:rid,
            alive:true
          });
        }

        closeModal();
        commit();
      }
    );
  }

      ()=>{

              roleId:"",
              alive:true

        closeModal();

  function killPlayer(p,reason) {

    if(p?.alive&&p.bless556){p.bless556=false;specialAlert('นักบวช',p.name+' รอดจากการกำจัด');return '';}
    if(
      p &&
      p.alive &&
      p.roleId==="prince" &&
      reason==="ถูกโหวต" &&
      !p.princeRevealed
    ) {

      p.princeRevealed = true;

      specialAlert(
        "🤴 เจ้าชายเปิดเผยตัวตน",
        p.name+
        " ถูกโหวต แต่รอดชีวิต "+
        "กรุณาให้ผู้เล่นเปิดเผยการ์ดเจ้าชาย"
      );

      return "";
    }


    const wasAlive =
      Boolean(p && p.alive);

    const result =
      killPlayerBeforeCupid(p,reason);

    let extra = "";

    if (
      wasAlive &&
      p &&
      !p.alive
    ) {

      extra = loverDeath(p);

    }

    return [result,extra]
      .filter(Boolean)
      .join(" / ");
  }

  function killPlayerBeforeCupid(p,reason) {

    const wasAlive = Boolean(
      p && p.alive
    );

    const result = originalKillPlayer(
      p,reason
    );

    if (
      wasAlive &&
      p &&
      !p.alive &&
      isHunter(p)
    ) {

      if (
        !hunterQueue().includes(p.id)
      ) {

        hunterQueue().push(p.id);

        log(
          "🏹 "+p.name+
          " รอเลือกเป้าหมาย"
        );
      }

      scheduleHunter();

      return "";
    }

    return result;
  }

  function originalKillPlayer(p,reason) {
    if(!p || !p.alive) return "";

    
    p.alive = false;
    if(p.roleId==='seer')alive().filter(x=>x.roleId==='apprentice').forEach(x=>{x.roleId='seer';specialAlert('ศิษย์เทพพยากรณ์',x.name+' รับบทเทพพยากรณ์');});
    if(p.roleId==='jester'&&reason==='ถูกโหวต')S.specialWin556='ยาจก: '+p.name;
    if(p.roleId==="wolfCub") {
      S.cubPending = true;
      log("คืนถัดไปหมาป่ากำจัดได้ 2 คน");
    }

    transformDoppelganger(p);
    
    delete S.votes[p.id];

    log(p.name+" เสียชีวิต: "+reason);

    if(p.roleId==="hunter") {
      log("นายพรานรอใช้ความสามารถ");
      return "🏹 "+p.name+
        " เป็นนายพราน กรุณาจัดการการยิง";
    }

    if(p.roleId==="jester" &&
       reason==="ถูกโหวต") {
      return "🤡 ตัวตลกถูกโหวต กรุณาตรวจสอบเงื่อนไขชนะ";
    }

    return "";
  }

  function shuffleRoles() {
    if(S.phase!=="setup") {
      return notice("สุ่มได้ก่อนเริ่มเกม");
    }

    const n = S.players.length;

    if(!n) return notice("เพิ่มผู้เล่นก่อน");

    const counts = {};

    
      S.players.forEach(p=>{
        p.originalRoleId = p.roleId;
    
      counts[p.roleId] =
        (counts[p.roleId]||0)+1;
    });

    showModal(
      "สุ่มบทบาท",
      `
      <p class="muted">
        ผู้เล่นทั้งหมด ${n} คน
      </p>

      ${S.roles.map(r=>`
        <div class="item row between">
          <span>${esc(r.icon+" "+r.name)}</span>
          <input type="number"
            class="count"
            min="0" max="${n}"
            id="count_${esc(r.id)}"
            value="${counts[r.id]||0}">
        </div>
      `).join("")}

      <p class="notice">
        จำนวนที่เหลือจะเติมชาวบ้านให้อัตโนมัติ
      </p>
      `,
      ()=>{
        const deck = [];

        for(const r of S.roles) {
          const count = Number(
            $("count_"+r.id).value
          );

          if(!Number.isInteger(count) ||
             count<0 || count>n) {
            return formError(
              "จำนวนบทบาทไม่ถูกต้อง"
            );
          }

          for(let i=0;i<count;i++) {
            deck.push(r.id);
          }
        }

        if(deck.length>n) {
          return formError(
            "ตัวละครมากกว่าผู้เล่น"
          );
        }

        while(deck.length<n) {
          deck.push("villager");
        }

        for(let i=deck.length-1;i>0;i--) {
          const j = Math.floor(
            Math.random()*(i+1)
          );

          [deck[i],deck[j]] =
            [deck[j],deck[i]];
        }

        snapshot();

        S.players.forEach((p,i)=>{
          p.roleId = deck[i];
          p.alive = true;
        });

        log("สุ่มบทบาทเรียบร้อย");
        closeModal();
        commit();
      },
      "สุ่มบทบาท"
    );
  }

  }
  function nightRoleName(r) {

    return names.join(" + ") || r.name;
  }
  function vampireTarget2515(actor,p) { return !!p?.alive && p.id !== actor; }
  function nightActors(r) {
    return alive().filter(p=>r.id==="wolf" ? isWolf(p) : p.roleId===r.id);
  }
  function nightInactive(r) {
    return !nightActors(r).length || (["priest","pi","trouble"].includes(r.id)&&!!S.used556?.[r.id]) || (r.id==="wolf" && S.wolfBlockedNight===S.night);

      seer: S.night > 0 && !S.actions.seer?.skip ? S.actions.seer?.target || '' : ''
    };

            ?isWolf(p) || ["wolf","wolfCub","lone"].includes(p.originalRoleId)

  function nightAction(skip=false) {

    if (hasPendingHunter()) {
      return openHunter();
    }

    if(S.phase!=="night") return;

    const r = role(S.queue[S.step]);

    if(!r.id) return;

    skip = skip || nightInactive(r);
    const data = {skip:skip};

    if(!skip) {

      
      if(r.id==="cupid") {

        data.lover1 =
          $("lover1")?.value || "";

        data.lover2 =
          $("lover2")?.value || "";

        if (
          !player(data.lover1)?.alive ||
          !player(data.lover2)?.alive
        ) {
          return notice(
            "กรุณาเลือกคู่รักให้ครบ 2 คน"
          );
        }

        if (
          data.lover1===data.lover2
        ) {
          return notice(
            "ไม่สามารถเลือกคนเดียวกันได้"
          );
        }

        data.note =
          nameOf(data.lover1)+
          " ❤️ "+
          nameOf(data.lover2);

      } else if(r.id==='hoodlum') {data.target=$('target')?.value;data.target2=$('target2')?.value;if(!player(data.target)?.alive||!player(data.target2)?.alive||data.target===data.target2||nightActors(r).some(p=>[data.target,data.target2].includes(p.id)))return notice('เลือกสองคนที่ไม่ใช่ตัวเอง');
      } else if(r.id==='mason'||r.id==='trouble'){data.note=r.id==='mason'?nightActors(r).map(p=>p.name).join(', '):'เปิดโหวตสองรอบ';
      } else if(r.action==="revealWolves") {
        data.note = alive()
          .filter(isWolf)
          .map(p=>p.name).join(", ");

      } else if(r.action==="witch") {

        data.heal = Boolean(
          $("heal")?.checked &&
          S.potions.heal
        );

        data.poison = S.potions.poison
          ?$("poison")?.value||""
          :"";

        if(data.heal &&
           !S.actions.wolf?.target) {
          return notice(
            "ไม่มีเหยื่อให้รักษา"
          );
        }

      } else if(
        r.action==="custom" ||
        r.action==="none"
      ) {
        data.note =
          $("customNote")?.value||"";

      } else {
        data.target =
          $("target")?.value||"";

        
        if(r.action==="kill" &&
           S.doubleAttack) {

          data.target2 =
            $("target2")?.value||"";

          if(data.target2 &&
             data.target2===data.target) {
            return notice(
              "ต้องเลือกเหยื่อคนละคน"
            );
          }
        }

        if(r.action==="copy") {
          const actors = alive().filter(
            p=>p.roleId===r.id
          );

          if(actors.length!==1) {
            return notice(
              "ระบบรองรับภูตจำแลงหนึ่งคนต่อเกม"
            );
          }

          if(actors[0].id===data.target) {
            return notice(
              "ไม่สามารถเลือกตัวเอง"
            );
          }
        }

        if (r.id === "vampire") {
          const actors = nightActors(r);
          data.actor = actors.length === 1 ? actors[0].id : $("vampireActor")?.value || "";
          if (!actors.some(p=>p.id===data.actor)) return notice("กรุณาเลือกแวมไพร์ที่ใช้พลัง");
          if (!vampireTarget2515(data.actor, player(data.target))) return notice("แวมไพร์ไม่สามารถเลือกฆ่าตัวเองได้ กรุณาเลือกเป้าหมายอื่น");
        }
        if (data.target && data.target === previousTarget(r.id)) {
          return notice("ไม่สามารถเลือกคนเดิมกับคืนก่อน กรุณาเลือกคนอื่น");
        }
        if (data.target && !player(data.target)?.alive) {
          return notice("กรุณาเลือกผู้เล่นที่ยังรอดชีวิต");
        }
        if(!data.target) {
          return notice(
            "เลือกเป้าหมายหรือกดข้าม"
          );
        }
      }
    }

    snapshot();

    
    S.actions[r.id] = data;
    if(!skip){S.used556=S.used556||{};if(['priest','pi','trouble'].includes(r.id))S.used556[r.id]=true;
      if(r.id==='priest')player(data.target).bless556=true;
      if(r.id==='trouble')S.extra556=1;
      if(r.id==='hag')S.exile556=data.target;
      if(r.id==='vampire')S.vamp556=data.target;
      if(r.id==='cult')player(data.target).cult556=true;
      if(r.id==='hoodlum')nightActors(r).forEach(p=>p.hood556=[data.target,data.target2]);
    }

    if (
      r.id==="cupid" &&
      !skip &&
      data.lover1 &&
      data.lover2
    ) {

      S.lovers = [
        data.lover1,
        data.lover2
      ];

      log(
        "💘 กามเทพจับคู่ "+
        nameOf(data.lover1)+
        " กับ "+
        nameOf(data.lover2)
      );
    }

    if(!skip && data.target) {

      if(r.action==="silence") {
        S.silenced = data.target;
      }

      if(r.action==="copy") {
        const actor = alive().find(
          p=>p.roleId===r.id
        );

        if(actor) {
          actor.copyTarget = data.target;
        }
      }

      if(r.action==="reveal") {
        const target = player(data.target);
        const actor = alive().find(
          p=>p.roleId===r.id
        );

        if(isWolf(target)) {
          data.victim = target.id;
        } else if(actor) {
          data.victim = actor.id;
        }
      }
    }
    

    if(data.heal) S.potions.heal = false;
    if(data.poison) S.potions.poison = false;

    let detail = skip
      ?"ข้าม"
      :data.target
        ?nameOf(data.target)
        :data.note||"ดำเนินการแล้ว";

    if(r.action==="witch"&&!skip) {
      detail =
        "รักษา: "+
        (data.heal?"ใช้":"ไม่ใช้")+
        " / พิษ: "+
        nameOf(data.poison);
    }

    log(r.name+" : "+detail);

    let result = "";

    if(r.action==="inspect"&&data.target) {
      const p = player(data.target);

      if(p) {
        result = p.name+" อยู่ฝ่าย "+
          teamName(p.roleId==="lycan"?"wolf":role(p.roleId).team);
      }
    }

    if(!skip&&data.target){const p=player(data.target);if(r.id==='aura')result=p.name+': '+(['wolf','villager'].includes(p.roleId)?'ไม่ใช่บทบาทพิเศษ':'บทบาทพิเศษ');if(r.id==='sorcerer')result=p.name+': '+(p.roleId==='seer'?'เป็นเทพพยากรณ์':'ไม่ใช่เทพพยากรณ์');if(r.id==='pi'){const i=S.players.indexOf(p),n=S.players.length;result='กลุ่มสามที่นั่ง: '+([-1,0,1].some(d=>isWolf(S.players[(i+d+n)%n]))?'พบหมาป่า':'ไม่พบหมาป่า');}}
    S.step++;
    commit();

    if(result) {
      notice(result,"🔮 ผลการตรวจสอบ");
    }
  }

  function resolveNight() {

    if (hasPendingHunter()) {
      return openHunter();
    }

    if(S.phase!=="night" ||
       S.step<S.queue.length) return;

    ask("สรุปผลกลางคืน?",()=>{
      snapshot();

      const wolfBlocked =
        S.wolfBlockedNight===S.night;

      const wolf = wolfBlocked
        ?null
        :S.actions.wolf?.target;
      const guard = S.actions.guard?.target;
      const witch = S.actions.witch||{};
      const deaths = new Set();
      const wolfVictims = new Set();

      
      const wolfTargets = [
        wolf,
        (wolfBlocked
          ?null
          :S.actions.wolf?.target2)
      ].filter(Boolean);

      wolfTargets.forEach((id,index)=>{
        if(id===guard || player(id)?.roleId==="vampire") return;
        if(index===0 && witch.heal) return;

        const p = player(id);

        if(!p?.alive) return;

        if(p.bless556){p.bless556=false;specialAlert("นักบวช",p.name+" รอดจากการโจมตี");return;}
        if(p.roleId==="cursed") {

          transformCursed(p);

        } else if(
          p.roleId==="toughGuy"
        ) {

          if(!p.toughDueNight) {

            p.toughDueNight =
              S.night+1;

            specialAlert(
              "💪 หนุ่มถึกถูกโจมตี",
              p.name+
              " ยังรอดชีวิต "+
              "และจะเสียชีวิตในคืนที่ "+
              p.toughDueNight
            );
          }

        } else {

          deaths.add(id);
          wolfVictims.add(id);
        }
      });

      if(S.actions.revealer?.victim) {
        deaths.add(
          S.actions.revealer.victim
        );
      }
    

      if(witch.poison) {
        deaths.add(witch.poison);
      }

      alive().forEach(p=>{

        if(
          p.toughDueNight>0 &&
          p.toughDueNight<=S.night
        ) {

          deaths.add(p.id);

          specialAlert(
            "💪 หนุ่มถึกครบกำหนด",
            p.name+
            " เสียชีวิตจากการโจมตีของหมาป่าในคืนก่อน"
          );
        }
      });

      if(S.night===1)alive().filter(p=>p.roleId==="ghost").forEach(p=>deaths.add(p.id));
      S.deaths = [];

      const messages = [];

      deaths.forEach(id=>{
        const p = player(id);

        if(p?.alive) {
          S.deaths.push(p.name);

          const infected =
            p.roleId==="diseased" &&
            wolfVictims.has(p.id);

          const msg = killPlayer(
            p,
            wolfVictims.has(p.id)
              ?"ถูกหมาป่ากำจัด"
              :"กลางคืน"
          );

          if(infected && !p.alive) {

            S.wolfBlockedNight =
              S.night+1;

            specialAlert(
              "🦠 หมาป่าติดเชื้อ",
              p.name+
              " ถูกหมาป่ากำจัด "+
              "หมาป่าจะโจมตีไม่ได้ในคืนที่ "+
              S.wolfBlockedNight
            );
          }

          if(msg) messages.push(msg);
        }
      });

      if(!S.deaths.length) {
        log("คืนนี้ไม่มีผู้เสียชีวิต");
      }

      S.phase = "day";
      if(S.night===3)alive().filter(p=>p.roleId==='drunk').forEach(p=>{const pool=S.roles.filter(r=>['villager','seer','guard','wolf'].includes(r.id));p.roleId=pool[Math.floor(Math.random()*pool.length)].id;specialAlert('ขี้เม่าสร่างเมา',p.name+' → '+role(p.roleId).name);});
      S.votes = {};
      S.voted = false;

      commit();

      if(messages.length) {
        notice(messages.join(" / "));
      }
    });
  }

  function canVotePhase() { return S.phase==="day" || S.phase==="discussion"; }

  function vote(id,delta) {
    if(!canVotePhase() ||
       S.vamp556 ||
       S.voted ||
       !player(id)?.alive || id===S.exile556) return;

    const total = Object.values(S.votes)
      .reduce((a,b)=>a+b,0);

    if(delta>0 &&
       total>=voteCap556()) {
      return notice(
        "คะแนนครบจำนวนผู้รอดชีวิตแล้ว"
      );
    }

    snapshot();

    S.votes[id] = Math.max(
      0,(S.votes[id]||0)+delta
    );

    commit();
  }

  function resetVotes() {
    if(S.voted) return;

    ask("ล้างคะแนนทั้งหมด?",()=>{
      snapshot();
      S.votes = {};
      commit();
    });
  }

  function executeVote() {

    if (hasPendingHunter()) {
      return openHunter();
    }

    if(!canVotePhase()||S.voted) return;
    if(resolveVampireBeforeVote2510())return;

    const list = alive().filter(p=>p.id!==S.exile556).map(p=>({
      id:p.id,
      votes:S.votes[p.id]||0
    })).sort((a,b)=>b.votes-a.votes);

    if(!list.length || !list[0].votes || list[1]?.votes===list[0].votes) {
      const reason = list[0]?.votes ? "คะแนนเสมอกัน: "+list.filter(v=>v.votes===list[0].votes).map(v=>nameOf(v.id)).join(", ")+" ("+list[0].votes+" คะแนน)" : "ไม่มีคะแนนโหวต";
      return ask(reason+" — ยืนยันผลโดยไม่มีผู้เสียชีวิต?",()=>{
        snapshot();
        log(reason+" — ไม่มีผู้เสียชีวิตจากการโหวต");
        S.voted=!S.extra556; S.extra556=0; S.votes={}; S.timerEnd=0; S.timerRemaining=0; tab="home";
        commit();
      });
    }

    const p = player(list[0].id);

    ask(
      "กำจัด "+p.name+" ด้วย "+
      list[0].votes+" คะแนน?",
      ()=>{
        snapshot();

        log(p.name+" ได้รับ "+
          list[0].votes+" คะแนน");

        const msg = killPlayer(
          p,"ถูกโหวต"
        );

        S.voted = !S.extra556; S.extra556=0;
        S.votes = {};
        S.timerEnd = 0; S.timerRemaining = 0;
        tab = "home";

        commit();

        if(msg) notice(msg);
      }
    );
  }

  function loneWinner258(){
    if(!["discussion","night","day"].includes(S.phase)||hasPendingHunter())return "";
    const list=alive();
    const lone=list.filter(p=>p.roleId==="lone");
    const otherWolf=p=>["wolf","wolfCub"].includes(p.roleId);
    const hadOther=S.players.some(p=>otherWolf(p)||["wolf","wolfCub"].includes(p.originalRoleId));
    return lone.length===1 && !list.some(otherWolf) && (hadOther||list.length===1) ? "หมาป่าเดียวดาย: "+lone[0].name : "";
  }
  function autoLoneWin258(){
    const w=loneWinner258();if(!w)return;
    S.result=w;S.phase="ended";S.timerEnd=0;S.timerRemaining=0;

    try{const h=JSON.parse(localStorage.getItem("WerewolfResults556")||"[]");h.unshift({date:new Date().toISOString(),balance:S.balanceStart556??balance556(playerCounts556()),result:w});localStorage.setItem("WerewolfResults556",JSON.stringify(h.slice(0,200)));}catch(e){}

  function vampireWinner2511(){
    if(!canVotePhase() || hasPendingHunter() || S.vamp556) return "";
    const list=alive();
    const vampires=list.filter(p=>p.roleId==="vampire").length;
    const others=list.length-vampires;
    return vampires>0 && !list.some(isWolf) && vampires>=others ? "แวมไพร์" : "";
  }
  function autoVampireWin2511(){
    const w=vampireWinner2511(); if(!w)return;
    S.result=w; S.phase="ended"; S.timerEnd=0; S.timerRemaining=0;
    log("จบเกม: "+w);
    try{const h=JSON.parse(localStorage.getItem("WerewolfResults556")||"[]");h.unshift({date:new Date().toISOString(),balance:S.balanceStart556??balance556(playerCounts556()),result:w});localStorage.setItem("WerewolfResults556",JSON.stringify(h.slice(0,200)));}catch(e){}
    tab="home";
  }
  function winner() {
    if(hasPendingHunter()) return "";
    if(loneWinner258())return loneWinner258();
    if(!canVotePhase()) return "";

    const list = alive();
    if(S.specialWin556)return S.specialWin556;
    
    if(list.some(p=>p.roleId==='cult')&&list.every(p=>p.roleId==='cult'||p.cult556))return 'เจ้าลัทธิ';
    if(vampireWinner2511())return vampireWinner2511();
    const wolves = list.filter(isWolf).length;

    const wolfTeam = list.filter(p=>
      role(p.roleId).team==="wolf"
    ).length;
    

    const neutral = list.filter(p=>
      role(p.roleId).team==="neutral"
    ).length;

    if(!list.length) {
      return "ไม่มีผู้รอดชีวิต";
    }

    if(list.some(p=>p.roleId==='vampire'))return '';
    if(!wolves) return "ฝ่ายชาวบ้าน";

    if(!list.some(p=>p.roleId==='lone')&&wolfTeam>=list.length-wolfTeam) {
      return "ฝ่ายหมาป่า";
    }

    return "";
  }

  function unlockAudio() {
    try { const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; audio ||= new AC(); audio.resume().catch(()=>{}); } catch(e) {}
  }
  function beep(final=false) {
    if(!prefs.sound || !audio || audio.state!=="running") return;
    try { const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=final?880:550; g.gain.value=.12; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+(final?.65:.2)); } catch(e) {}
  }
  function timerStart(minutes) {
    if(!["day","discussion"].includes(S.phase)) return;
    unlockAudio(); snapshot(); S.timerDuration=Math.round(minutes*60); S.timerRemaining=0; S.timerEnd=Date.now()+S.timerDuration*1000; commit(); tick();
  }
  function timerStop() { if(!S.timerEnd) return; snapshot(); S.timerRemaining=Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000)); S.timerEnd=0; commit(); tick(); }
  function timerResume() { unlockAudio(); if(!S.timerRemaining) return; snapshot(); S.timerEnd=Date.now()+S.timerRemaining*1000; S.timerRemaining=0; commit(); tick(); }
  function timerReset() { snapshot(); S.timerEnd=0; S.timerRemaining=S.timerDuration||180; commit(); tick(); }
  function timerCustom() { showModal("กำหนดเวลา", '<label>นาที (1–120)</label><input id="customMinutes" type="number" min="1" max="120" value="3">',()=>{const n=Number($("customMinutes").value); if(!Number.isInteger(n)||n<1||n>120)return formError("กรอก 1–120 นาที"); closeModal(); timerStart(n);},"เริ่มจับเวลา"); }
  function timerPanel() { return `<h3>⏱ เวลาอภิปราย</h3><div class="timer" id="timer">00:00</div><div class="timerBar13" aria-hidden="true"><i id="timerFill13"></i></div><div class="row">${[1,3,5,10].map(n=>btn(n+" นาที","timerStart("+n+")","grow mini")).join("")}</div>${btn("รีเซ็ต","timerReset()","full")}`; }
  function tick() {
    const sec=S.timerEnd?Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000)):(S.timerRemaining||0);
    const el=$("timer"); if(el){el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");el.style.color=S.timerEnd&&sec<=10?"#f08090":"#ffffff";}
    if(el){el.classList.toggle("urgent13",!!S.timerEnd&&sec<=10);const fill=$("timerFill13");if(fill)fill.style.width=Math.min(100,100*sec/Math.max(1,S.timerDuration||180))+"%";}
    if(S.timerEnd&&sec>0&&sec<=10&&prefs.warning&&warnedEnd!==S.timerEnd){warnedEnd=S.timerEnd;beep();}
    if(S.timerEnd&&sec===0){S.timerEnd=0;S.timerRemaining=0;beep(true);commit();if(!$("modal").innerHTML)notice("⏰ หมดเวลาอภิปราย");else status="หมดเวลาอภิปราย";}
  }

  document.addEventListener("visibilitychange",keepAwake);

  function getRevealer() {
    return alive().find(p => {
      const r = role(p.roleId);

      return r.id === "revealer" ||
        r.name.includes("ผู้เผยตัวตน");
    });

  function useRevealer() {

    if (hasPendingHunter()) {
      return openHunter();
    }


    if (!canVotePhase()) {
      return notice(
        "ใช้พลังได้เฉพาะช่วงอภิปรายก่อนคืนแรกหรือกลางวัน"
      );
    }

    if (S.revealerUsed) {
      return notice("ใช้พลังไปแล้ว");
    }

    const actor = getRevealer();

    if (!actor) {
      return notice(
        "ไม่มีผู้เผยตัวตนที่รอดชีวิต"
      );
    }

    showModal(
      "👁️ ผู้เผยตัวตน",
      `
      <div class="speech">
        ผู้ใช้พลัง: ${esc(actor.name)}
        <br>
        ใช้ได้เพียงครั้งเดียวตลอดเกม
      </div>

      <label>เลือกผู้เล่น</label>

      <select id="revealTarget">
        ${targets("",p=>p.id!==actor.id)}
      </select>

      <p class="notice">
        หากเป้าหมายเป็นมนุษย์หมาป่า
        เป้าหมายจะเสียชีวิต
        หากไม่ใช่ ผู้เผยตัวตนจะตายแทน
      </p>
      `,
      ()=>{
        const target = player(
          $("revealTarget").value
        );

        if (!target ||
            !target.alive ||
            target.id === actor.id) {
          return formError(
            "กรุณาเลือกเป้าหมาย"
          );
        }

        closeModal();

        ask(
          "ยืนยันใช้พลังกับ "+
          target.name+"?",
          ()=>{

            if (S.revealerUsed ||
                !canVotePhase() ||
                !actor.alive ||
                !target.alive) {
              return notice(
                "ไม่สามารถใช้พลังได้"
              );
            }

            snapshot();

            S.revealerUsed = true;

            const r = role(target.roleId);

            // สมุนรับใช้ไม่ใช่มนุษย์หมาป่า

            const isWolf =
              r.id === "wolf" ||
              r.name === "หมาป่า" ||
              r.name.includes("มนุษย์หมาป่า");

            let result;
            let extra;

            if (isWolf) {

              extra = killPlayer(
                target,
                "พลังผู้เผยตัวตน"
              );

              result =
                target.name+
                " เป็นมนุษย์หมาป่า และเสียชีวิต";

            } else {

              extra = killPlayer(
                actor,
                "ใช้พลังผู้เผยตัวตนผิด"
              );

              result =
                target.name+
                " ไม่ใช่มนุษย์หมาป่า "+
                actor.name+" เสียชีวิตแทน";
            }

            log("ผู้เผยตัวตน: "+result);

            commit();

            notice(
              result + (extra?" / "+extra:""),
              "👁️ ผลการใช้พลัง"
            );
          }
        );
      },
      "ใช้พลัง"
    );
  }

  function hunterQueue() {

    if (!Array.isArray(S.hunterPending)) {
      S.hunterPending = [];

    return S.hunterPending;
  }

  function isHunter(p) {

    if (!p) return false;

    const r = role(p.roleId);

    return r.id === "hunter" ||
      r.name.includes("นายพราน");
  }

  function hasPendingHunter() {
    return hunterQueue().some(id => {
      const p = player(id);
      return p && !p.alive;
    });
  }

  let hunterTimer = null;

  function scheduleHunter() {

    if (hunterTimer !== null) {
      clearTimeout(hunterTimer);
    }

    hunterTimer = setTimeout(() => {

      hunterTimer = null;

      if (
        S.phase === "setup" ||
        S.phase === "ended"
      ) return;

      if (hasPendingHunter()) {
        openHunter();
      }

    }, 180);
  }

  function openHunter() {

    const id = hunterQueue().find(id => {
      const p = player(id);
      return p && !p.alive;
    });

    const hunter = player(id);

    if (!hunter) return;

    if (!alive().length) {

      snapshot();

      S.hunterPending = [];

      log("นายพรานไม่มีเป้าหมาย");

      commit();
      return;
    }

    showModal(
      "🏹 นายพรานใช้พลัง",
      `
      <div class="speech">

        <b>${esc(hunter.name)}</b>
        ถูกกำจัดแล้ว

        <br><br>

        เลือกผู้เล่นที่จะยิง
        ก่อนออกจากเกม

      </div>

      <label>เลือกเป้าหมาย</label>

      <select id="hunterTarget">
        ${targets()}
      </select>

      <p class="notice">
        ผู้เล่นที่เลือกจะเสียชีวิตทันที
      </p>
      `,
      ()=>{

        const target = player(
          $("hunterTarget").value
        );

        if (!target || !target.alive) {
          return formError(
            "กรุณาเลือกผู้เล่น"
          );
        }

        if (
          !hunterQueue().includes(id) ||
          hunter.alive
        ) {
          closeModal();
          return;
        }

        closeModal();

        ask(
          "ยืนยันให้นายพราน "+
          hunter.name+
          " ยิง "+target.name+"?",
          ()=>{

            if (
              !target.alive ||
              hunter.alive ||
              !hunterQueue().includes(id)
            ) {
              return notice(
                "ไม่สามารถใช้พลังได้"
              );
            }

            snapshot();

            S.hunterPending =
              hunterQueue().filter(
                x => x !== id
              );

            const extra = killPlayer(
              target,
              "ถูกนายพรานยิง"
            );

            if (
              S.phase === "night" ||
              (
                S.phase === "day" &&
                !S.voted
              )
            ) {

              S.deaths = S.deaths || [];

              if (
                !S.deaths.includes(
                  target.name
                )
              ) {
                S.deaths.push(
                  target.name
                );
              }
            }

            log(
              "🏹 "+hunter.name+
              " ยิง "+target.name
            );

            tab = "home";

            commit();

            if (hasPendingHunter()) {

              scheduleHunter();

            } else {

              notice(
                target.name+
                " ถูกนายพรานกำจัด"+
                (extra?" / "+extra:""),
                "🏹 ผลการยิง"
              );

            }
          }
        );
      },
      "🏹 ยืนยันยิง"
    );
  }

  function transformDoppelganger(dead) {

    if (!dead || dead.alive) return;

    const actors = alive().filter(p =>
      p.roleId === "doppelganger" &&
      p.copyTarget === dead.id
    );

    actors.forEach(actor => {

      const oldRole = actor.roleId;
      const newRole = dead.roleId;

      if (!role(newRole).id) return;

      actor.originalRoleId =
        actor.originalRoleId || oldRole;

      actor.roleId = newRole;

      delete actor.copyTarget;

      actor.transformedFrom = dead.name;
      actor.transformedNight = S.night;

      if (!Array.isArray(S.copyNotices)) {
        S.copyNotices = [];
      }

      S.copyNotices.push({
        id: uid(),
        player: actor.name,
        target: dead.name,
        roleId: newRole,
        night: S.night
      });

      log(
        "🎭 " + actor.name +
        " สวมรอยเป็น " +
        role(newRole).name +
        " แทน " + dead.name
      );

    });
  }

  function checkRegistration(el) {

    const reg = registrationState();

    if(!reg) return;

    const rid = reg.queue[reg.step];
    const limit = reg.counts[rid];

    const boxes = Array.from(
      document.querySelectorAll(
        ".registrationCheck"
      )
    );

    let count = boxes.filter(
      x=>x.checked
    ).length;

    if(count>limit && el) {
      el.checked = false;
      count--;
    }

    const label = $("regSelected");

    if(label) {
      label.textContent =
        "เลือกแล้ว "+count+
        " / "+limit+" คน";

      label.className =
        "item "+
        (count===limit?"green":"gold");
    }
  }

  function confirmRegistration() {

    const reg = registrationState();

    if(!validRegistration() ||
       S.phase!=="setup") return;

    const rid = reg.queue[reg.step];

    const ids = Array.from(
      document.querySelectorAll(
        ".registrationCheck:checked"
      )
    ).map(x=>x.value);

    if(ids.length!==reg.counts[rid]) {

      return notice(
        "กรุณาเลือกผู้เล่นให้ครบ "+
        reg.counts[rid]+" คน"
      );
    }

    if(ids.some(id=>
      !player(id) ||
      (
        reg.assignments[id] &&
        reg.assignments[id]!==rid
      )
    )) {
      return notice(
        "พบผู้เล่นที่ลงทะเบียนแล้ว"
      );
    }

    snapshot();

    Object.keys(reg.assignments)
      .forEach(id=>{
        if(reg.assignments[id]===rid) {
          delete reg.assignments[id];
        }
      });

    ids.forEach(id=>{
      reg.assignments[id] = rid;
    });

    reg.step++;

    reg.complete =
      reg.step>=reg.queue.length;

    commit();

    notice(
      role(rid).name+
      " ลงทะเบียนเรียบร้อย "+
      (wolfRegIds258.includes(rid) && wolfRegIds258.includes(reg.queue[reg.step]) ? "ทีมหมาป่ายังไม่ต้องหลับตา ลงทะเบียนบทบาทถัดไป" : wolfRegIds258.includes(rid) ? "ให้ทีมหมาป่าทั้งหมดหลับตาลงได้" : "ให้หลับตาลงได้"),
      "✓ บันทึกแล้ว"
    );
  }

  function previousRegistration() {

    const reg = registrationState();

    if(!reg || reg.step<=0) {

      return openRegistration();
    }

    snapshot();

    reg.step--;
    reg.complete = false;

    const rid = reg.queue[reg.step];

    Object.keys(reg.assignments)
      .forEach(id=>{
        if(reg.assignments[id]===rid) {
          delete reg.assignments[id];
        }
      });

    commit();
  }

  function finishRegistration() {

    const reg = registrationState();

    if(!validRegistration() ||
       S.phase!=="setup") return;

    if(reg.step<reg.queue.length) {
      return notice(
        "ยังลงทะเบียนไม่ครบ"
      );
    }

    const actual = {};

    S.players.forEach(p=>{

      const rid =
        reg.assignments[p.id] ||
        "villager";

      actual[rid] =
        (actual[rid]||0)+1;
    });

    if(S.roles.some(r=>
      (actual[r.id]||0)!==
      (reg.counts[r.id]||0)
    )) {
      return notice(
        "จำนวนบทบาทไม่ตรง กรุณาตรวจสอบ"
      );
    }

    ask(
      "ยืนยันบทบาทผู้เล่นทั้งหมด "+
      S.players.length+" คน?",
      ()=>{

        snapshot();

        S.players.forEach(p=>{

          p.roleId =
            reg.assignments[p.id] ||
            "villager";

          p.originalRoleId = p.roleId;
          p.alive = true;

          delete p.copyTarget;
        });

        delete S.registration;

        log(
          "ลงทะเบียนบทบาทแบบหลับตาครบแล้ว"
        );

        tab = "home";

        commit();

        startGame();
      }
    );
  }

        snapshot();

        delete S.registration;

        commit();
      }
    );
  }

  function resolveVampireBeforeVote2510() {
    if(S.phase!=="day" || !S.vamp556) return false;
    snapshot();
    const p=player(S.vamp556);
    S.vamp556="";
    if(p?.alive){
      const before=new Set(alive().map(x=>x.id));
      killPlayer(p,"แวมไพร์");
      const dead=S.players.filter(x=>before.has(x.id)&&!x.alive);
      if(dead.length){
        dead.forEach(x=>delete S.votes[x.id]);
        const msg="ก่อนเริ่มโหวต มีผู้เสียชีวิตจากแวมไพร์: "+dead.map(x=>x.name).join("、");
        specialAlert("🧛 ประกาศก่อนโหวต",msg);
        commit();
        notice(msg,"🧛 ประกาศก่อนโหวต");
        return true;
      }
    }
    commit();
    return false;
  }

  function playerCounts556(){const c={};S.players.forEach(p=>{const id=p.roleId;if(id)c[id]=(c[id]||0)+1});return c;}

  function balancePanel556(c,reg=false){const v=balance556(c),n=Object.values(c).reduce((a,b)=>a+b,0),w=(c.wolf||0)+(c.wolfCub||0)+(c.lone||0);let msg=v==null?'มีบทบาทไม่ทราบแต้ม':Math.abs(v)<=2?'ใกล้สมดุล':v>0?'ชาวบ้านมีแนวโน้มได้เปรียบ':'หมาป่ามีแนวโน้มได้เปรียบ';let warnings=[];if(!w||w>=n/2)warnings.push('ตรวจจำนวนหมาป่า');if(c.mason===1)warnings.push('เมสันควรมีอย่างน้อย 2 คน');if(c.apprentice&&!c.seer)warnings.push('ศิษย์ควรมีเทพพยากรณ์');if(c.pi)warnings.push('ลงทะเบียนตามที่นั่งจริง');if(['priest','pi','trouble','hoodlum','drunk','cult','vampire','hag'].some(id=>c[id]>1))warnings.push('บทบาทพิเศษใหม่ควรเลือกอย่างละหนึ่งคน');let suggestions=[];if(reg&&v!=null&&n===S.players.length)for(const [id,k] of Object.entries(c))for(const r of S.roles){if(!k||id===r.id||r.balance==null||r.id==='littleGirl'||(c[r.id]&&r.id!=='villager'&&r.id!=='wolf'))continue;const cc={...c,[id]:k-1,[r.id]:(c[r.id]||0)+1},ww=(cc.wolf||0)+(cc.wolfCub||0)+(cc.lone||0);const z=balance556(cc);if(ww>0&&ww<n/2&&Math.abs(z)<Math.abs(v))suggestions.push({id,to:r.id,z});}suggestions.sort((a,b)=>Math.abs(a.z)-Math.abs(b.z));return `<div class="item"><b class="${v!=null&&Math.abs(v)<=2?'green':'gold'}">⚖️ แต้ม ${v==null?'?':v>0?'+'+v:v} · ${msg}</b><p class="small muted">แต้มประมาณการ ไม่ใช่โอกาสชนะ · <a href="https://www.online-station.net/entertainment/690636">อ้างอิง</a></p>${warnings.map(x=>`<p class="gold small">${x}</p>`).join('')}${suggestions.slice(0,3).map(x=>btn('เปลี่ยน '+role(x.id).name+' → '+role(x.to).name+' ('+x.z+')',call('swap556',x.id,x.to),'full')).join('')}</div>`;}

  const artIds13=new Set(Object.keys(embeddedArt13));
  function portrait13(r){return `<span class="${artIds13.has(r.id)?"emoji13":""}">${esc(r.icon)}</span>${artIds13.has(r.id)?`<img class="pixel13" src="${embeddedArt13[r.id]}" alt="" aria-hidden="true">`:''}`;}
  function sceneKey13(){return S.phase==='night'?'night':votingOpen?'vote':S.phase==='day'||S.phase==='discussion'?'day':'setup';}
  function victory13(){const t=String(S.result||'');const k=t.includes('เดียวดาย')?'lone':t.includes('แวมไพร์')?'vampire':t.includes('หมาป่า')?'wolf':t.includes('ชาวบ้าน')?'village':'neutral';return `<div class="victory13"><img src="${embeddedArt13["scene-"+k]}" alt=""><h2>VICTORY · ${esc(t)}</h2></div>`;}
  let lastVisual13='';
  function visualSound13(win){if(visualPref13('sfx','off')!=='on'||visualPref13('theme','retro')==='classic')return;try{unlockAudio();if(!audio)return;const now=audio.currentTime;const notes=win?[392,494,587,784]:[330,440];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.035,now+i*.09);g.gain.exponentialRampToValueAtTime(.001,now+i*.09+.12);o.connect(g);g.connect(audio.destination);o.start(now+i*.09);o.stop(now+i*.09+.13)})}catch(e){}}
  function visualAfter13(){applyVisual13();const k=sceneKey13(),state=S.phase+'|'+k+'|'+S.night;document.body.dataset.scene13=k;if(lastVisual13&&lastVisual13!==state){$('app').classList.remove('phaseFlash13');void $('app').offsetWidth;$('app').classList.add('phaseFlash13');visualSound13(S.phase==='ended');}lastVisual13=state;}
  window.setVisual13=setVisual13;

  function render() {

    applyVisual13();
    const pages = {
      home:homePage,
      players:playersPage,
      roles:rolesPage,
      vote:votePage,
      history:historyPage, settings:settingsPage, more:morePage, powers:powers25, share:sharePage25
    };

    if(!canVotePhase() || S.voted) votingOpen=false;
    const nav = [
      ["home","🏠","ดำเนินเกม"],
      ["players","👥","ผู้เล่น"],
      ["more","☰","เพิ่มเติม"]
    ];

    const phase = {
      setup:"เตรียมเกม", discussion:"อภิปรายก่อนเกม",
      night:"🌙 คืนที่ "+S.night,
      day:"☀️ วันที่ "+S.night,
      ended:"จบเกม"
    }[S.phase];

    $("app").innerHTML = `
      <header class="row between">
        <div>
          <h1>🐺 WEREWOLF</h1>

          <div class="subtitle">
            MODERATOR WEB APP V2.5.15
          </div>
        </div>

        <div class="badge">
          ${esc(phase)}
        </div>
      </header>

      <div class="scene13"><img src="${embeddedArt13["scene-"+sceneKey13()]}" alt=""></div>
      ${S.phase==="setup"?'<div class="intro13">DARK FANTASY · เริ่มการผจญภัย</div>':""}
      <div class="stats">

        <div class="stat">
          <strong>${S.players.length}</strong>
          <small>ผู้เล่นทั้งหมด</small>
        </div>

        <div class="stat">
          <strong class="green">
            ${alive().length}
          </strong>
          <small>รอดชีวิต</small>
        </div>

        <div class="stat">
          <strong class="red">
            ${S.players.length-alive().length}
          </strong>
          <small>เสียชีวิต</small>
        </div>

      </div>

      <div class="row between toolbar">
        <span id="saveStatus"
          class="small muted">
          ● ${esc(status)}
        </span>

        ${btn("↩ ย้อนกลับ",
          "undo()","mini")}
      </div>

      ${["roles","history","settings","powers","share"].includes(tab)?btn("‹ กลับเมนูเพิ่มเติม",call("go","more"),"full"):""}
      ${tab==="home"&&["night","day","discussion"].includes(S.phase)?`<div class="moderator-tools">${btn(prefs.compact25?"แสดงเต็ม":"โหมดแบบย่อ","toggleCompact25()")}${btn("⚡ ดูพลัง","showPowers25()")}</div>`:""}
      ${pages[tab]()}

      <nav>
        ${nav.map(n=>`
          <button
            class="${(tab===n[0] || (n[0]==="more" && ["roles","history","settings","powers","share"].includes(tab)))
              ?"active":""}"
            onclick="${esc(call("go",n[0]))}">

            <span>${n[1]}</span>
            ${n[2]}

          </button>
        `).join("")}
      </nav>
    `;
    visualAfter13();
  }

  // เปิดให้ HTML เรียกฟังก์ชันได้

  Object.assign(window,{

    toggleCompact25, showPowers25, copyLink25, shareLink25, manualVote25, manualExecute25, noVote25,
    clearPlayers,
    closeModal,
    submitModal,
    undo,
    editPlayer,
    quickAdd,
    deletePlayer,
    changeLife,
    shuffleRoles,
    editRole,
    deleteRole,
    startGame,
    nightAction,
    resolveNight,
    nextNight,
    vote,
    resetVotes,
    executeVote,
    endGame,
    resetGame,
    timerStart,
    timerStop,
    toggleInlineVote,
    go
  });

  render();
  keepAwake();
  tick();
  setInterval(tick,250);

    if (
      S.phase !== "setup" &&
      S.phase !== "ended" &&
      hasPendingHunter()
    ) {
      scheduleHunter();
    }
}

    let game = fresh();

    try {
      const saved = localStorage.getItem(
        "WerewolfMasterV2"
      );

      if (saved) {
        const old = JSON.parse(saved);

        if (
          Array.isArray(old.players) &&
          Array.isArray(old.roles)
        ) {
          game = Object.assign(game, old);
        }
      }
    } catch(e) {
      console.log(e);
    }

    game.version = "2.5";

    dashboard(game);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("./sw.js")
        .catch(console.log);
    }
  </script>
